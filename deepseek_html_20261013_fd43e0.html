    /* ============ 动画 / 操作判定 ============ */
    function q(id){ return document.getElementById(id); }
    function on(el,cls){ if(el) el.classList.add(cls); }
    function off(el,cls){ if(el) el.classList.remove(cls); }
    function puffMist(id, times, gap){
      const el = q(id); if(!el) return;
      let n = 0;
      const tick = () => { off(el,'on'); void el.offsetWidth; on(el,'on'); n++; if(n<times) setTimeout(tick, gap); };
      tick();
      setTimeout(()=>off(el,'on'), times*gap + 1300);
    }

    function act(name){
      if(completed.has(current) && name!=='report'){ toast('本阶段已完成，可继续下一阶段。'); return; }

      if(current===0){
        if(name==='uvOn'){
          if(step!==0) return wrong('当前无需操作','请按任务顺序进行。');
          const wb=q('workbench'); on(wb,'uv-mode'); off(wb,'attention');
          on(document.querySelector('.lab-room'),'uv');
          on(q('uvTimer'),'on');
          busyUntil = Date.now() + 2600;
          good('紫外灯已打开','操作区进入紫外消毒状态，紫外照射 30 min 杀灭台面与空气中的微生物。');
        }
        if(name==='uvOff'){
          if(step!==1) return wrong('请先打开紫外灯','先完成紫外消毒，再关闭紫外灯。');
          const wb=q('workbench'); off(wb,'uv-mode'); on(wb,'bench-on');
          off(document.querySelector('.lab-room'),'uv');
          off(q('uvTimer'),'on');
          setTimeout(()=>on(q('airStreams'),'on'), 250);
          busyUntil = Date.now() + 1900;
          good('紫外灯已关闭，风机启动','层流洁净气流稳定送出，可以开始取材与接种操作。');
        }
      }

      if(current===1){
        if(name==='tissue'){
          if(step!==0) return wrong('先识别材料','请先确认横切面上的韧皮部。');
          tissueChosen = true;
          off(q('slice'),'pulse'); on(q('slice'),'picked');
          const rh=q('rigHand'); on(rh,'show'); on(rh,'acting');
          setTimeout(()=>{ off(rh,'acting'); off(rh,'show'); }, 2900);
          busyUntil = Date.now() + 3000;
          good('已点选整块韧皮部','戴手套的手在横切面上点选韧皮部，取下一整块韧皮部组织作为外植体材料。');
        }
        if(name==='rinse'){
          if(!tissueChosen || step!==1) return wrong('操作顺序不正确','应先用流水冲洗外植体。');
          tissueRinsed = true;
          on(q('slabBoard'),'gone'); off(q('slabSter'),'gone');
          const rs=q('rigSter'); on(rs,'show'); on(rs,'rinse');
          on(q('rinseStation'),'on');
          setTimeout(()=>off(q('rinseStation'),'on'), 2300);
          setTimeout(()=>{ on(q('slabSter'),'gone'); off(q('slabBoard'),'gone'); }, 3350);
          setTimeout(()=>{ off(rs,'rinse'); off(rs,'show'); }, 3900);
          busyUntil = Date.now() + 4100;
          good('流水冲洗完成','用流水冲洗去掉外植体表面附着的尘土和部分微生物。');
        }
        if(name==='sterilize'){
          if(!tissueRinsed || step!==2) return wrong('操作顺序不正确','应先用流水冲洗干净。');
          tissueSterile = true;
          on(q('slabBoard'),'gone');
          off(q('slabSter'),'gone');
          const rs=q('rigSter'); on(rs,'show'); on(rs,'acting');
          setTimeout(()=>on(q('tk1'),'active'), 900);
          setTimeout(()=>off(q('tk1'),'active'), 1600);
          setTimeout(()=>on(q('tk2'),'active'), 2500);
          setTimeout(()=>off(q('tk2'),'active'), 3300);
          setTimeout(()=>on(q('tk3'),'active'), 4000);
          setTimeout(()=>off(q('tk3'),'active'), 4800);
          /* 镊子一直夹着外植体，送回取材板并放下后手臂才消失 */
          setTimeout(()=>{ on(q('slabSter'),'gone'); off(q('slabBoard'),'gone'); }, 5200);
          setTimeout(()=>{ off(rs,'acting'); off(rs,'show'); }, 5400);
          busyUntil = Date.now() + 5600;
          good('外植体消毒完成','75% 酒精 30 s → 10% 次氯酸钙 10 min → 无菌水冲洗 3 次，三步一次走完。');
        }
        if(name==='cut'){
          if(!tissueSterile || step!==3) return wrong('不可直接切取','外植体必须先完成表面消毒。');
          on(q('slabBoard'),'gone');
          const rk=q('rigKnife'); on(rk,'show'); on(rk,'cutting');
          setTimeout(()=>document.querySelectorAll('.blk').forEach((el,i)=>setTimeout(()=>on(el,'in'), i*170)), 1650);
          setTimeout(()=>{ off(rk,'cutting'); off(rk,'show'); }, 2950);
          busyUntil = Date.now() + 3000;
          good('无菌切取完成','用解剖刀切取消毒后的内部组织，切成约 5 mm 见方的小块，逐块放入无菌培养皿。');
        }
      }

      if(current===2){
        if(name==='inspectMS'){
          if(step!==0) return wrong('操作顺序不正确','请先检查培养基组成。');
          msChecked = true;
          on(q('msPanel'),'checked');
          good('MS 培养基组成已确认','大量元素、微量元素、蔗糖、维生素与植物激素共同支持离体组织生长与分化。');
        }
        if(name==='sterileTool'){
          if(!msChecked || step!==1) return wrong('请先检查培养基','确认培养基组成后，再进行无菌接种操作。');
          toolSterile = true;
          const r1=q('rigTwFlame'); on(r1,'show'); on(r1,'acting');
          const tips = r1.querySelectorAll('.t-tweezers i');
          setTimeout(()=>tips.forEach(t=>on(t,'hot')), 1400);
          setTimeout(()=>{ tips.forEach(t=>{ off(t,'hot'); on(t,'cool'); }); on(q('steam'),'on'); on(q('coolChip'),'on'); }, 2300);
          setTimeout(()=>{ off(q('steam'),'on'); off(q('coolChip'),'on'); off(r1,'acting'); off(r1,'show'); }, 3500);
          busyUntil = Date.now() + 3600;
          good('镊子已火焰灭菌','镊子尖端在火焰中灼烧至红热，移出后稍作冷却，避免烫伤外植体。');
        }
        if(name==='inoculate'){
          if(!toolSterile || step!==2) return wrong('无菌操作不规范','必须先火焰灭菌镊子并冷却，再接种。');
          const r2=q('rigTwPick'); on(r2,'show'); on(r2,'acting');
          setTimeout(()=>on(q('tubeCap'),'open'), 950);
          setTimeout(()=>{ on(q('tubeExplant'),'in'); on(q('ripple'),'on'); }, 2550);
          setTimeout(()=>off(q('ripple'),'on'), 3300);
          setTimeout(()=>{ off(r2,'acting'); off(r2,'show'); }, 3700);
          busyUntil = Date.now() + 3800;
          good('接种完成','镊子夹取外植体，瓶盖旋开、切口朝下接入培养基，瓶口重新封好。');
        }
      }

      if(current===3){
        if(name==='time'){
          if(step!==0) return wrong('当前无需快进','请按任务顺序推进培养时间。');
          fastTime(12, ()=>good('已培养 12 天','外植体切口处开始出现浅黄色细胞团。'));
        }
        if(name==='growCallus'){
          if(step!==1) return wrong('培养时间不足','先启动时间快进，等待脱分化。');
          growCellCluster();
        }
        if(name==='scope'){
          if(step!==2) return wrong('样本尚未形成','先观察愈伤组织增殖。');
          drawCells(true); good('观察到正在分裂的细胞','细胞数量增加，说明脱分化与增殖正在发生。');
        }
      }

      if(current===4){
        if(name==='bud'){
          if(step!==0) return wrong('操作顺序不正确','请先完成当前步骤。');
          showBuds();
          good('愈伤组织分化出芽点','表层细胞重新组织形成芽原基，表面出现绿色芽点。');
        }
        if(name==='observeBud'){
          if(step!==1) return wrong('芽点尚未形成','请先诱导愈伤组织分化出芽。');
          on(q('plantlet'),'grow');
          good('芽已发育成带叶的幼芽','芽原基伸长，茎叶系统逐渐建立。');
        }
        if(name==='root'){
          if(step!==2) return wrong('芽尚未长成','先让芽发育成完整的茎叶系统，再诱导生根。');
          on(q('plantlet'),'rooted');
          good('幼芽基部形成不定根','根系建立后，小植株可独立吸收水分和无机盐。');
        }
        if(name==='check'){
          if(step!==3) return wrong('根系尚未形成','请先诱导生根，形成完整试管苗。');
          good('完整试管苗建成','芽（茎叶）与根齐全，一株完整的小植株诞生了。');
        }
      }

      if(current===5){
        if(name==='openCap'){
          if(step!==0) return wrong('操作顺序不正确','先打开瓶盖开始炼苗。');
          capOpened = true;
          on(q('tubeCap2'),'open');
          const rc=q('rigCap'); on(rc,'show'); on(rc,'acting');
          setTimeout(()=>on(q('dome'),'open'), 900);
          setTimeout(()=>{ off(rc,'acting'); off(rc,'show'); }, 3100);
          busyUntil = Date.now() + 3200;
          good('瓶盖已打开','旋开瓶盖并移开，驯化罩通风口逐步打开，让幼苗适应较低湿度。');
        }
        if(name==='dry'){
          if(!capOpened || step!==1) return wrong('先开盖炼苗','逐步通风后才能降低环境湿度。');
          lowerHumidity();
        }
        if(name==='transplant'){
          if(step!==2) return wrong('湿度尚未降低','先把湿度降到 70% 左右再移栽。');
          const rp=q('rigPlant'); on(rp,'show'); on(rp,'acting');
          const pl=q('plantlet2'); on(pl,'taken');
          setTimeout(()=>{ on(pl,'gone'); on(q('potPlant'),'in'); }, 2600);
          setTimeout(()=>{ off(rp,'acting'); off(rp,'show'); }, 3200);
          busyUntil = Date.now() + 3300;
          good('移栽成功','取出整株试管苗、洗去根部培养基后植入疏松消毒的基质，驯化罩内继续保湿缓苗。');
        }
      }

      if(current===6){
        if(name==='review'){
          if(step!==0) return wrong('请按顺序检查','先回顾培养节点。');
          fastTime(6, ()=>good('流程回顾完成','外植体 → 愈伤组织 → 芽 → 根 → 试管苗 → 完整植株。'));
        }
        if(name==='checkPlant'){
          if(step!==1) return wrong('请先回顾流程','建立完整证据链后再检查植株。');
          on(q('fullPlant'),'verified');
          good('植株生长正常','根、茎、叶结构完整，移栽后持续生长。');
        }
        if(name==='report'){
          if(step!==2) return wrong('报告证据不完整','请先完成流程回顾和植株检查。');
          good('实验报告已生成','实验闭环完成。');
          setTimeout(openReport,900);
        }
      }
    }

    /* ============ 测验 / 报告 ============ */
    function openQuiz(st){
      /* 只有仍然停在原阶段时才弹题，且无题的阶段不弹 */
      if(typeof st === 'number' && st !== current) return;
      const s = stages[current];
      if(!s || !s.quiz || !s.options || !s.options.length) return;
      transitionPending = false;
      $('#quizQuestion').textContent = s.quiz;
      $('#quizExplain').textContent = '请选择一个答案。';
      $('#quizContinue').disabled = true;
      $('#quizOptions').innerHTML = s.options.map((o,i)=>`<button class="quiz-option" data-option="${i}">${String.fromCharCode(65+i)}. ${o}</button>`).join('');
      $('#quizModal').classList.add('open');
      if(autoMode){
        setTimeout(()=>{
          const btn = document.querySelector(`.quiz-option[data-option="${s.correct}"]`);
          if(btn) btn.click();
          setTimeout(()=>$('#quizModal').classList.remove('open'), 850);
        }, 700);
      }
    }
    function answerQuiz(i){
      const s = stages[current];
      const buttons = [...document.querySelectorAll('.quiz-option')];
      buttons.forEach(b=>b.disabled=true);
      buttons[s.correct].classList.add('correct');
      if(i===s.correct){
        if(!answered.has(current)) quizScore++;
        $('#quizExplain').textContent = '回答正确。' + s.explain;
        beep(true);
      }else{
        buttons[i].classList.add('wrong');
        $('#quizExplain').textContent = '再想一想。' + s.explain;
        errors++; beep(false);
      }
      answered.add(current);
      $('#quizContinue').disabled = false;
    }
    function openReport(){
      $('#reportCompletion').textContent = `${Math.round(completed.size/stages.length*100)}%`;
      $('#reportScore').textContent = `${quizScore}/${QUIZ_TOTAL}`;
      $('#reportErrors').textContent = errors;
      $('#reportTable').innerHTML = stages.map((s,i)=>`<tr><td>阶段 ${i} · ${s.nav}</td><td>${completed.has(i)?'已完成':'未完成'}</td></tr>`).join('');
      $('#reportModal').classList.add('open');
    }

    /* ============ 阶段切换 / 重置 ============ */
    function changeStage(i){
      if(i<0 || i>=stages.length) return;
      current = i; transitionPending = false;
      $('#quizModal').classList.remove('open');
      $('#reportModal').classList.remove('open');
      toolSterile = false; msChecked = completed.has(2); tissueChosen = false; tissueRinsed = false; tissueSterile = false;
      capOpened = false; humidity = completed.has(5)?70:95; drying = false;
      render();
    }
    function reset(){
      if(!confirm('确定要清除当前实验进度并重新开始吗？')) return;
      completed.clear(); answered.clear();
      current=0; step=0; errors=0; quizScore=0; autoMode=false;
      toolSterile=false; msChecked=false; tissueChosen=false; tissueRinsed=false; tissueSterile=false;
      capOpened=false; humidity=95; drying=false;
      clearTimeout(autoTimer);
      transitionPending = false;
      autoStall = 0;
      $('#autoBtn').classList.remove('active');
      $('#autoBtn').textContent='自动演示';
      updateProgress(); render(); toast('实验已重置');
    }

    /* ============ 事件绑定 ============ */
    nav.addEventListener('click', e=>{
      const b = e.target.closest('[data-stage]');
      if(b) changeStage(+b.dataset.stage);
    });
    actions.addEventListener('click', e=>{
      const b = e.target.closest('[data-act]');
      if(b) act(b.dataset.act);
    });
    $('#quizOptions').addEventListener('click', e=>{
      const b = e.target.closest('[data-option]');
      if(b) answerQuiz(+b.dataset.option);
    });
    $('#quizContinue').addEventListener('click', ()=>{
      $('#quizModal').classList.remove('open');
      if(current<6) changeStage(current+1); else openReport();
    });
    $('#prevBtn').addEventListener('click', ()=>changeStage(current-1));
    $('#nextBtn').addEventListener('click', ()=>{
      if(!completed.has(current)){
        wrong('请先完成本阶段','请按当前步骤完成操作，再进入下一阶段。');
        return;
      }
      current===6 ? openReport() : changeStage(current+1);
    });
    $('#resetBtn').addEventListener('click', reset);
    $('#closeReport').addEventListener('click', ()=>$('#reportModal').classList.remove('open'));
    $('#printBtn').addEventListener('click', ()=>window.print());

    /* ============ 自动演示 ============ */
    $('#autoBtn').addEventListener('click', ()=>{
      autoMode = !autoMode;
      $('#autoBtn').classList.toggle('active', autoMode);
      $('#autoBtn').textContent = autoMode ? '停止演示' : '自动演示';
      clearTimeout(autoTimer);
      autoStall = 0;
      if(autoMode) autoDemo();
    });

    /* 右侧步骤：点一下就能执行这一步 */
    $('#steps').addEventListener('click', e=>{
      const el = e.target.closest('.step');
      if(!el) return;
      if($('#quizModal').classList.contains('open') || $('#reportModal').classList.contains('open')) return;
      const idx = Number(el.dataset.step);
      const name = el.dataset.act;
      if(!name) return;
      if(completed.has(current)){ toast('本阶段操作已全部完成'); return; }
      if(idx > step){ wrong('请按顺序操作','请先完成第 '+(step+1)+' 步：'+stages[current].steps[step]); return; }
      if(idx < step){ toast('这一步已经完成'); return; }
      act(name);
    });
    $('#steps').addEventListener('keydown', e=>{
      if((e.key==='Enter'||e.key===' ') && e.target.classList.contains('step') && e.target.dataset.act){
        e.preventDefault(); e.target.click();
      }
    });

    function autoDemo(){
      if(!autoMode) return;
      if($('#quizModal').classList.contains('open')){ autoTimer=setTimeout(autoDemo,500); return; }
      if(transitionPending){ autoTimer=setTimeout(autoDemo,800); return; }
      if(Date.now() < busyUntil){ autoTimer=setTimeout(autoDemo,500); return; }
      if(completed.has(current)){
        if(current<6){ changeStage(current+1); autoTimer=setTimeout(autoDemo,700); }
        else{ openReport(); autoMode=false; $('#autoBtn').classList.remove('active'); $('#autoBtn').textContent='自动演示'; }
        return;
      }
      const seq = STAGE_ACTS[current];
      if(!seq || step>=seq.length){ autoTimer=setTimeout(autoDemo,800); return; }
      const name = seq[step];
      const before = step;
      if(name) act(name);
      /* 卡住保护：连续多次操作没能推进就自动停止演示 */
      autoStall = (step===before) ? autoStall+1 : 0;
      if(autoStall>=5){
        autoMode=false; autoStall=0;
        $('#autoBtn').classList.remove('active'); $('#autoBtn').textContent='自动演示';
        toast('演示已暂停','bad'); return;
      }
      autoTimer = setTimeout(autoDemo, current===3 ? 3800 : ((current===2||current===5) ? 2700 : 1600));
    }

    /* ============ 键盘快捷键 ============ */
    document.addEventListener('keydown', e=>{
      if($('#quizModal').classList.contains('open') || $('#reportModal').classList.contains('open')) return;
      if(e.key==='ArrowRight') changeStage(Math.min(6,current+1));
      if(e.key==='ArrowLeft') changeStage(Math.max(0,current-1));
    });

    updateProgress();
    render();
  })();
  </script>
</body>
</html>
