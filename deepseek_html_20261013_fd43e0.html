    @keyframes fadeIn { from{opacity:0}to{opacity:1} }

    @media(max-width:1050px){
      .workspace{grid-template-columns:1fr}.side-panel{display:grid;grid-template-columns:repeat(2,1fr)}.bottom-controls{grid-column:1/-1}.stage-nav{overflow-x:auto;grid-template-columns:repeat(7,140px)}.lab-shell{min-height:640px}
    }
    @media(max-width:720px){
      .topbar{padding:10px 14px;flex-wrap:wrap;gap:10px}.brand{min-width:auto;flex:1}.brand p,.status-pill{display:none}.progress-area{order:3;flex-basis:100%}.stage-nav{padding:10px 12px 6px}.workspace{padding:6px 12px 18px}.lab-shell{min-height:690px;border-radius:18px}.lab-head{top:62px;left:16px;right:16px}.lab-head h2{font-size:22px}.day-chip{display:none}.scene{inset:170px 12px 185px}.scene-card{gap:22px;transform:scale(.82)}.scene-actions{left:12px;right:12px;bottom:12px;flex-wrap:wrap}.action-hint{flex:1 0 100%}.side-panel{grid-template-columns:1fr}.report-grid{grid-template-columns:1fr 1fr}.btn{padding:10px 12px}.cell-canvas{width:200px;height:150px}.orbit{width:330px;height:260px}
    }
    /* =================================================================
       迭代升级：实验室房间 + 写实超净工作台 + 分步操作动画
       ================================================================= */
    .scene{position:absolute;inset:150px 26px 126px;z-index:2}
    .lab-room{position:absolute;inset:0;border-radius:18px;overflow:hidden;
      background:radial-gradient(78% 58% at 15% -12%,rgba(255,255,255,.96),rgba(255,255,255,0) 62%),
        linear-gradient(#f8fafb 0 57%,#eef1f3 57% 61%,#8fc4e6 61% 100%);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.7),inset 0 24px 60px rgba(206,223,233,.45),0 16px 40px rgba(70,90,105,.12);}
    .lab-room::before{content:"";position:absolute;left:0;right:0;top:0;height:57%;
      background:linear-gradient(90deg,rgba(120,140,155,.10) 0 1px,transparent 1px) 0 0/33.34% 100%,
        linear-gradient(180deg,rgba(255,255,255,.92),rgba(226,232,236,.5));}
    .lab-room::after{content:"";position:absolute;left:0;right:0;top:calc(57% - 8px);height:14px;
      background:linear-gradient(180deg,#e0e6e9,#c2ccd1);box-shadow:0 8px 16px rgba(60,95,120,.16);}

    /* 环境 HUD（温度 / 湿度） */
    .env-hud{position:absolute;top:9px;right:11px;display:flex;gap:7px;z-index:9}
    .env-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px 5px 9px;border-radius:9px;font-size:12px;font-weight:800;color:#cfe6f3;
      background:linear-gradient(180deg,#2c3f4f,#182630);box-shadow:0 6px 16px rgba(15,30,45,.32),inset 0 1px 0 rgba(255,255,255,.14);letter-spacing:.02em}
    .env-chip b{color:#fff;margin-left:2px;font-variant-numeric:tabular-nums}
    .env-chip::before{content:"";width:7px;height:7px;border-radius:50%;background:#7ec850;box-shadow:0 0 8px rgba(126,200,80,.9)}
    .env-chip.temp::before{background:#f0a13c;box-shadow:0 0 8px rgba(240,161,60,.95)}
    .env-chip.hum::before{background:#5fc4e8;box-shadow:0 0 8px rgba(95,196,232,.95)}

    /* 房间陈设 */
    .prop-table{position:absolute;right:-26px;bottom:30%;width:150px;height:64px;background:linear-gradient(180deg,#fbfdfe,#dbe2e6);border-radius:8px 0 0 8px;box-shadow:inset 0 -6px 0 #c3ccd1,0 12px 22px rgba(60,90,110,.18)}
    .prop-table::after{content:"";position:absolute;left:0;right:0;bottom:-30px;height:30px;background:linear-gradient(90deg,#ccd4d9,#adb7bd);border-radius:0 0 4px 4px}
    .pty-outlet{position:absolute;top:16px;width:16px;height:16px;border-radius:4px;background:#f2f4f5;border:1px solid #cdd5da;box-shadow:inset 0 0 0 2px #fff}
    .pty-outlet:nth-child(1){left:26px}.pty-outlet:nth-child(2){left:66px}.pty-outlet:nth-child(3){left:106px}
    .prop-cart{position:absolute;left:-18px;bottom:26%;width:80px;height:96px;border-radius:8px;background:linear-gradient(180deg,#eef3f5,#cdd6db);box-shadow:0 12px 22px rgba(60,90,110,.18)}
    .prop-cart::after{content:"";position:absolute;left:6px;right:6px;top:0;height:10px;border-radius:8px 8px 0 0;background:linear-gradient(180deg,#ffffff,#dbe2e6)}
    .prop-cart i{position:absolute;left:8px;right:8px;height:3px;background:#b9c3c9;border-radius:2px}
    .prop-cart i:nth-child(1){top:30px}.prop-cart i:nth-child(2){top:54px}.prop-cart i:nth-child(3){top:78px}
    .bench-shadow{position:absolute;left:50%;bottom:6.5%;transform:translateX(-50%);width:min(500px,84%);height:34px;border-radius:50%;background:radial-gradient(ellipse,rgba(40,70,95,.34),transparent 70%);filter:blur(3px)}

    /* ================= 超净工作台（写实 2.5D） ================= */
    .workbench{position:absolute;left:50%;bottom:9%;width:min(520px,88%);aspect-ratio:520/344;transform:translateX(-50%);z-index:4}
    .workbench.attention{animation:benchAttention 1.9s ease-in-out infinite}
    .wb-head{position:relative;height:12%;border-radius:9px 9px 0 0;
      background:linear-gradient(180deg,#ffffff,#eaf0f2 58%,#d5dde1);
      border:1px solid rgba(255,255,255,.95);box-shadow:inset 0 -7px 12px rgba(150,168,178,.22),inset 0 2px 0 rgba(255,255,255,.9);
      display:flex;align-items:center;justify-content:space-between;padding:0 12px}
    .wb-brand{display:flex;align-items:center;gap:7px;font-size:clamp(8px,.9vw,11px);font-weight:900;color:#4a5a66;letter-spacing:.06em}
    .wb-brand i{width:16px;height:16px;border-radius:5px;background:linear-gradient(145deg,#3d8fce,#1c5f96);box-shadow:0 2px 5px rgba(20,80,135,.4)}
    .wb-ctl{display:flex;align-items:center;gap:5px;padding:4px 9px;border-radius:7px;background:linear-gradient(180deg,#33424f,#1d2a34);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
    .wb-ctl b{font-size:8px;color:#b9cddb;font-weight:700}
    .wb-ctl .led{width:8px;height:8px;border-radius:50%;background:#5b6b76;box-shadow:inset 0 0 2px rgba(0,0,0,.6);transition:.3s}
    .wb-body{position:relative;height:66%;background:linear-gradient(180deg,#eef3f5,#dde4e8 45%,#ccd5da);box-shadow:inset 0 8px 18px rgba(255,255,255,.55),inset 0 -6px 14px rgba(140,160,172,.22);overflow:hidden}
    .wb-accent{position:absolute;left:0;right:0;top:0;height:8px;z-index:7;background:linear-gradient(180deg,#3f93d3,#1e6cae 65%,#16588e);box-shadow:0 4px 12px rgba(20,80,135,.42)}
    .wb-frame{position:absolute;top:0;bottom:0;width:11px;z-index:8;background:linear-gradient(90deg,#5b8fb3,#2d6b9c)}
    .wb-frame.left{left:0}.wb-frame.right{right:0;background:linear-gradient(270deg,#5b8fb3,#2d6b9c)}
    .wb-opening{position:absolute;inset:0;overflow:hidden}
    .wb-backwall{position:absolute;left:12%;right:12%;top:11%;bottom:22%;background:linear-gradient(180deg,#e3e9ec,#d2dade 55%,#c6ced3);box-shadow:inset 0 0 30px rgba(120,140,150,.32)}
    .hepa-grille{position:absolute;left:0;right:0;top:0;height:56%;background-color:#d6dde1;
      background-image:radial-gradient(circle at 2px 2px,rgba(96,116,126,.55) 1.05px,transparent 1.7px);background-size:7px 7px;
      box-shadow:inset 0 0 20px rgba(90,110,120,.4),inset 0 -2px 0 rgba(255,255,255,.55)}
    .uv-lamp{position:absolute;left:8%;right:8%;bottom:12px;height:8px;border-radius:5px;background:#c9d8de;transition:.4s}
    .uv-lamp.uv-on{background:linear-gradient(180deg,#eafcff,#8fe4f5);box-shadow:0 0 22px rgba(110,220,245,.95),0 0 46px rgba(110,220,245,.5);animation:uvGlow 1.6s ease-in-out infinite}
    .back-plate{position:absolute;right:6px;bottom:-15px;font-size:8px;color:#93a0a9;letter-spacing:.1em}
    .wb-ceiling{position:absolute;inset:0;background:linear-gradient(180deg,#f4f8fa,#dde5e9);clip-path:polygon(0 0,12% 11%,88% 11%,100% 0)}
    .wb-side{position:absolute;inset:0}
    .wb-side.left{background:linear-gradient(90deg,#c8d1d6,#e8eef1);clip-path:polygon(0 0,12% 11%,12% 78%,0 100%)}
    .wb-side.right{background:linear-gradient(270deg,#c1cbd1,#e8eef1);clip-path:polygon(100% 0,88% 11%,88% 78%,100% 100%)}
    .wb-deck{position:absolute;inset:0;background:linear-gradient(180deg,#cbd3d8 0%,#e9eef0 44%,#f6f9fa 100%);clip-path:polygon(0 100%,100% 100%,88% 78%,12% 78%)}
    .wb-lip{position:absolute;left:0;right:0;bottom:0;height:5%;background:linear-gradient(180deg,#eef3f5,#b6c1c8);box-shadow:inset 0 2px 0 rgba(255,255,255,.9),0 -4px 10px rgba(90,110,125,.25)}
    .wb-sash{position:absolute;inset:0;z-index:6;pointer-events:none;
      background:linear-gradient(112deg,rgba(255,255,255,.42) 0 9%,rgba(214,238,247,.14) 17%,rgba(255,255,255,0) 34%),linear-gradient(180deg,rgba(255,255,255,.26),rgba(178,214,230,.14));
      border:1px solid rgba(255,255,255,.55);box-shadow:inset 0 0 44px rgba(255,255,255,.4)}
    .wb-sash::after{content:"";position:absolute;left:6%;top:8%;width:22%;height:64%;background:linear-gradient(104deg,rgba(255,255,255,.62),rgba(255,255,255,0));transform:skewX(-16deg);filter:blur(.5px)}
    .deck-items{position:absolute;inset:0;z-index:3}
    .d-item{position:absolute;left:var(--x);bottom:var(--b);transform:translateX(-50%) scale(var(--s,1));transform-origin:50% 100%}
    .d-item.target{outline:2px solid rgba(217,95,85,.92);outline-offset:6px;border-radius:6px;animation:tgtPulse 1.1s ease-in-out infinite}
    .d-item.target::after{content:attr(data-label);position:absolute;left:50%;top:-27px;transform:translateX(-50%);background:rgba(217,95,85,.94);color:#fff;font-size:10px;font-weight:800;padding:3px 8px;border-radius:7px;white-space:nowrap;box-shadow:0 4px 10px rgba(150,50,40,.35)}
    .obj-bottle{width:34px;height:78px;background:linear-gradient(90deg,rgba(220,235,240,.55),rgba(255,255,255,.8));border:1px solid rgba(150,180,190,.65);border-radius:6px;box-shadow:inset 0 -26px 0 rgba(120,180,210,.5),inset 2px 0 0 rgba(255,255,255,.7),0 6px 10px rgba(60,90,110,.25)}
    .obj-bottle::before{content:"";position:absolute;left:50%;top:-13px;transform:translateX(-50%);width:16px;height:13px;background:linear-gradient(90deg,#2f7fb5,#1d5f8c);border-radius:3px 3px 0 0}
    .obj-dish{width:66px;height:22px;border-radius:50%;background:radial-gradient(ellipse at 50% 35%,#f4f8fa,#cdd8de);box-shadow:0 6px 10px rgba(60,90,110,.28),inset 0 -4px 6px rgba(120,150,165,.4);border:2px solid rgba(255,255,255,.75)}
    .obj-box{width:56px;height:44px;background:linear-gradient(180deg,#ffffff,#e2e8ea);border:1px solid rgba(180,195,200,.85);border-radius:4px;box-shadow:0 6px 10px rgba(60,90,110,.22)}
    .obj-box::after{content:"";position:absolute;left:8px;right:8px;top:12px;height:2px;background:#dbe2e6;box-shadow:0 8px 0 #dbe2e6}
    .obj-spray{width:26px;height:60px;border-radius:6px;background:linear-gradient(90deg,#e8f2f6,#ffffff);border:1px solid rgba(150,180,190,.65)}
    .obj-spray::before{content:"";position:absolute;top:-10px;left:3px;width:20px;height:12px;background:linear-gradient(180deg,#3f93d3,#1f6cae);border-radius:3px}

    /* 洁净气流 */
    .air-streams{position:absolute;inset:0;z-index:5;opacity:0;transition:opacity .5s ease;pointer-events:none}
    .air-streams.on{opacity:1}
    .air-streams i{position:absolute;left:-46%;width:46%;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(150,225,250,.9),transparent);animation:airMove 2.5s linear infinite}
    .air-streams i:nth-child(1){top:20%;animation-delay:0s}
    .air-streams i:nth-child(2){top:34%;animation-delay:.5s}
    .air-streams i:nth-child(3){top:48%;animation-delay:1s}
    .air-streams i:nth-child(4){top:62%;animation-delay:1.5s}
    .air-streams i:nth-child(5){top:76%;animation-delay:2s}
    .air-cap{position:absolute;right:14px;top:16px;font-size:10px;font-weight:800;color:#e6f7ff;background:rgba(30,108,174,.78);padding:3px 9px;border-radius:7px;letter-spacing:.04em}

    /* ================= 阶段 1：取材工作台 ================= */
    .lab-table{position:absolute;left:-3%;right:-3%;top:56%;height:14%;background:linear-gradient(180deg,#f5f9fa,#dde4e8 45%,#c6cfd5);box-shadow:0 16px 30px rgba(50,80,105,.24),inset 0 2px 0 rgba(255,255,255,.9);border-radius:5px;z-index:0}
    .lab-table::after{content:"";position:absolute;left:0;right:0;top:100%;height:150%;background:linear-gradient(180deg,#aeb9c0,#8b98a1)}
    .stage-tissue{position:absolute;left:0;right:0;top:0;bottom:44%;display:flex;align-items:flex-end;justify-content:center;gap:5%;z-index:2}
    .cut-board{position:relative;width:min(260px,32%);aspect-ratio:260/170;border-radius:16px;background:linear-gradient(180deg,#f2e4cd,#dcc7a4);box-shadow:0 18px 28px rgba(120,90,50,.24),inset 0 0 0 3px rgba(255,255,255,.55)}
    .cut-board .carrot{position:absolute;left:6%;bottom:26%;transform:scale(.5);transform-origin:bottom left}
    .cut-board .slice-ring{position:absolute;right:8%;bottom:16%;width:104px;height:104px;transform:scale(.92)}
    .cut-board .scalpel{position:absolute;right:6%;top:8%;transform:rotate(-22deg) scale(.62)}
    .stage-tissue .petri{position:relative;width:170px;height:60px;align-self:flex-end}
    .spray-bottle{position:absolute;left:7%;bottom:0;width:44px;height:118px;transform-origin:50% 100%}
    .sp-body{position:absolute;inset:14px 0 0;border-radius:8px 8px 12px 12px;background:linear-gradient(90deg,rgba(226,240,246,.85),rgba(255,255,255,.95));border:1px solid rgba(150,180,190,.6);box-shadow:inset -6px 0 10px rgba(120,160,175,.2),0 10px 16px rgba(60,90,110,.22)}
    .sp-body::after{content:"";position:absolute;left:3px;right:3px;bottom:3px;height:58%;border-radius:6px 6px 10px 10px;background:linear-gradient(180deg,rgba(150,205,230,.35),rgba(90,170,210,.5))}
    .sp-nozzle{position:absolute;left:2px;top:0;width:40px;height:18px;border-radius:5px;background:linear-gradient(180deg,#3f93d3,#1f6cae);box-shadow:0 4px 8px rgba(20,80,135,.35)}
    .sp-label{position:absolute;left:50%;bottom:-22px;transform:translateX(-50%);white-space:nowrap;font-size:11px;font-weight:800;color:#3d5a6b;background:rgba(255,255,255,.8);border-radius:7px;padding:3px 8px}
    .spray-bottle.spraying{animation:sprayShake .45s ease-in-out 3}
    .mist{position:absolute;left:13%;bottom:10%;width:34%;height:56%;pointer-events:none}
    .mist i{position:absolute;left:50%;top:6%;width:7px;height:7px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(150,205,230,.5));opacity:0}
    .mist.on i{animation:mistFall 1.15s ease-out forwards}
    .mist.on i:nth-child(1){--dx:-46px;--dy:70px;animation-delay:0s}
    .mist.on i:nth-child(2){--dx:-22px;--dy:84px;animation-delay:.08s}
    .mist.on i:nth-child(3){--dx:2px;--dy:92px;animation-delay:.16s}
    .mist.on i:nth-child(4){--dx:24px;--dy:84px;animation-delay:.24s}
    .mist.on i:nth-child(5){--dx:44px;--dy:70px;animation-delay:.32s}
    .mist.on i:nth-child(6){--dx:0px;--dy:60px;animation-delay:.4s}
    .tissue-block{position:absolute;left:50%;bottom:14px;width:22px;height:16px;margin-left:-11px;border-radius:3px;background:linear-gradient(145deg,#ffd88a,#f2a53c);box-shadow:0 3px 6px rgba(140,90,20,.35);opacity:0;transition:opacity .3s}
    .tissue-block.show{animation:blockDrop .9s cubic-bezier(.3,1.3,.5,1) forwards}

    /* ================= 阶段 2：台内接种 ================= */
    .bench-interior{position:absolute;inset:5% 9%;border-radius:16px;overflow:visible;background:linear-gradient(180deg,#e6ebee,#d8dfe3);box-shadow:inset 0 0 0 1px rgba(255,255,255,.8),0 18px 40px rgba(40,70,95,.25)}
    .bi-back{position:absolute;left:9%;right:9%;top:9%;bottom:20%;background:linear-gradient(180deg,#e1e7ea,#cdd6da);box-shadow:inset 0 0 34px rgba(110,130,142,.35)}
    .bi-ceiling{position:absolute;inset:0;background:linear-gradient(180deg,#f4f8fa,#dde5e9);clip-path:polygon(0 0,9% 9%,91% 9%,100% 0)}
    .bi-side{position:absolute;inset:0}
    .bi-side.left{background:linear-gradient(90deg,#c6cfd4,#e6ecef);clip-path:polygon(0 0,9% 9%,9% 80%,0 100%)}
    .bi-side.right{background:linear-gradient(270deg,#c0cad0,#e6ecef);clip-path:polygon(100% 0,91% 9%,91% 80%,100% 100%)}
    .bi-deck{position:absolute;inset:0;background:linear-gradient(180deg,#cbd3d8,#eef2f4 55%,#f6f9fa);clip-path:polygon(0 100%,100% 100%,91% 80%,9% 80%)}
    .bi-items{position:absolute;inset:0;z-index:3}
    .bi-item{position:absolute}
    .lamp{left:21%;bottom:19%;width:56px;height:58px}
    .lamp-body{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:44px;height:42px;border-radius:8px 8px 12px 12px;background:linear-gradient(180deg,#cfe3ea,#9fc3d2);box-shadow:inset 2px 0 0 rgba(255,255,255,.6),0 8px 12px rgba(60,90,110,.25)}
    .lamp-body::after{content:"";position:absolute;left:50%;top:-8px;transform:translateX(-50%);width:14px;height:12px;background:#8fb3c2;border-radius:3px}
    .flame{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);width:20px;height:44px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:radial-gradient(ellipse at 50% 82%,#fff7c2 0 24%,#ffb43c 40%,rgba(255,120,30,.8) 64%,rgba(255,90,20,0) 100%);filter:blur(.4px);animation:flameFlick .28s infinite alternate;transform-origin:50% 100%;box-shadow:0 0 26px rgba(255,170,60,.7)}
    .tweezers{left:44%;bottom:38%;width:76px;height:14px;transform-origin:0 50%;transition:transform .6s cubic-bezier(.3,.9,.3,1)}
    .tweezers .tw-a,.tweezers .tw-b{position:absolute;left:0;width:100%;height:3px;border-radius:2px;background:linear-gradient(90deg,#9aa7b0,#e4ebef)}
    .tweezers .tw-a{top:1px;transform:rotate(4deg)}
    .tweezers .tw-b{top:9px;transform:rotate(-4deg)}
    .tweezers .tw-tip{position:absolute;left:100%;top:0;width:13px;height:13px;background:linear-gradient(90deg,#c6d0d6,#eef3f5);clip-path:polygon(0 0,100% 38%,100% 62%,0 100%);transition:.3s}
    .tweezers .tw-tip.hot{background:linear-gradient(90deg,#ffb43c,#ff5a1e);box-shadow:0 0 16px rgba(255,110,40,.95)}
    .tweezers .tw-tip.cool{background:linear-gradient(90deg,#c6d0d6,#eef3f5)}
    .tweezers.to-flame{transform:rotate(-24deg) translate(-6px,-4px)}
    .tweezers.pick{transform:rotate(6deg) translate(26px,-2px)}
    .culture-tube{left:66%;bottom:14%;width:54px;height:118px}
    .tube-glass{position:absolute;inset:0;border-radius:8px 8px 22px 22px;background:linear-gradient(90deg,rgba(255,255,255,.62),rgba(206,228,236,.35));border:1.5px solid rgba(255,255,255,.95);box-shadow:inset 4px 0 8px rgba(255,255,255,.6),inset -6px 0 12px rgba(120,150,165,.28),0 10px 16px rgba(60,90,110,.22);overflow:hidden}
    .tube-medium{position:absolute;left:2px;right:2px;bottom:2px;height:34%;border-radius:6px 6px 20px 20px;background:linear-gradient(180deg,rgba(240,200,90,.42),rgba(233,170,50,.62))}
    .tube-cap{position:absolute;left:-4px;right:-4px;top:-12px;height:20px;border-radius:8px;background:linear-gradient(180deg,#3f93d3,#1f6cae);box-shadow:0 4px 8px rgba(20,80,135,.35);transform-origin:65% 100%;transition:transform .6s cubic-bezier(.3,.9,.3,1);z-index:2}
    .tube-cap.open{transform:translate(30px,-34px) rotate(32deg)}
    .tube-explant{position:absolute;left:50%;bottom:8px;width:20px;height:14px;margin-left:-10px;border-radius:3px;background:linear-gradient(145deg,#ffe0a0,#f0a13c);transform:scale(0);transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
    .tube-explant.in{transform:scale(1)}
    .bi-hint{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);font-size:11px;color:#5a6b76;background:rgba(255,255,255,.78);border-radius:8px;padding:5px 11px;white-space:nowrap;box-shadow:0 5px 12px rgba(60,90,110,.14)}

    /* ================= 阶段 3/4 组合场景 ================= */
    .callus-stage,.organo-stage,.acclim-stage{position:absolute;left:0;right:0;top:0;bottom:44%;display:flex;align-items:flex-end;justify-content:center;gap:6%;z-index:2}
    .final-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:6%;padding:15% 8% 12%;z-index:2}
    .callus-stage .petri,.organo-stage .petri{align-self:flex-end}
    .callus-stage .callus-cluster{transform:scale(1.3)}
    .petri.tall{width:190px;height:66px;display:flex;align-items:center;justify-content:center}
    .stage-tissue .petri,.callus-stage .petri,.organo-stage .petri{border:2px solid rgba(255,255,255,.94);box-shadow:inset 0 -8px 14px rgba(120,150,165,.26),0 14px 22px rgba(60,90,110,.2)}
    .organo-stage .testtube,.acclim-stage .testtube{border:2px solid rgba(255,255,255,.94);box-shadow:inset 8px 0 16px rgba(255,255,255,.6),inset -10px 0 20px rgba(118,150,166,.32),0 16px 24px rgba(60,90,110,.22)}
    .buds.shown .bud{opacity:1;transform:scale(1) translateY(0)}
    .plantlet .micro-hint{position:absolute;left:50%;bottom:-22px;transform:translateX(-50%);white-space:nowrap;font-size:11px;color:#3e7a52;background:rgba(255,255,255,.85);border-radius:7px;padding:3px 8px}
    .full-plant.verified{animation:float 4s ease-in-out infinite,verifyGlow 1.6s ease-in-out infinite}

    /* ================= 关键帧 ================= */
    @keyframes airMove{from{transform:translateX(0);opacity:0}12%{opacity:1}to{transform:translateX(230%);opacity:0}}
    @keyframes uvGlow{0%,100%{opacity:.85}50%{opacity:1}}
    @keyframes flameFlick{from{transform:translateX(-50%) scaleY(1) scaleX(1)}to{transform:translateX(-50%) scaleY(1.15) scaleX(.9)}}
    @keyframes benchAttention{0%,100%{filter:drop-shadow(0 0 0 rgba(245,166,35,0))}50%{filter:drop-shadow(0 0 20px rgba(245,166,35,.6))}}
    @keyframes tgtPulse{0%,100%{outline-color:rgba(217,95,85,.9)}50%{outline-color:rgba(217,95,85,.35)}}
    @keyframes sprayShake{0%,100%{transform:rotate(0)}50%{transform:rotate(-7deg)}}
    @keyframes mistFall{0%{opacity:0;transform:translate(0,0) scale(.4)}30%{opacity:.95}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.5)}}
    @keyframes blockDrop{0%{opacity:0;transform:translateY(-26px) rotate(-40deg) scale(.6)}70%{opacity:1;transform:translateY(2px) rotate(8deg) scale(1)}100%{opacity:1;transform:translateY(0) rotate(0) scale(1)}}
    @keyframes verifyGlow{0%,100%{filter:drop-shadow(0 0 0 rgba(62,155,90,0))}50%{filter:drop-shadow(0 0 18px rgba(62,155,90,.6))}}

    .wb-base{position:relative;height:22%}
    .wb-base .wb-cab{position:absolute;left:8%;right:8%;top:0;height:56%;border-radius:0 0 8px 8px;background:linear-gradient(180deg,#f4f8fa,#dde4e8);box-shadow:inset 0 -5px 0 #c3ccd1,0 12px 20px rgba(60,90,110,.18)}
    .wb-base .wb-cab::after{content:"";position:absolute;left:50%;top:44%;width:52px;height:5px;transform:translateX(-50%);border-radius:3px;background:#c8d1d6}
    .wb-base .wb-leg{position:absolute;bottom:0;width:12px;height:46%;background:linear-gradient(90deg,#d3dade,#aeb8be);border-radius:0 0 5px 5px}
    .wb-base .wb-leg.l{left:12%}.wb-base .wb-leg.r{right:12%}
    .wb-base .wb-plate{position:absolute;left:50%;bottom:44%;transform:translateX(-50%);font-size:9px;font-weight:800;color:#7d8b95;letter-spacing:.12em;white-space:nowrap}
    .slice-ring.picked{animation:pickedZoom .9s ease}
    @keyframes pickedZoom{0%{transform:scale(.92)}50%{transform:scale(1.08)}100%{transform:scale(.92)}}
    .plantlet.transplanted{animation:transplantHop 1s ease}
    @keyframes transplantHop{0%{transform:translateX(-50%) scaleY(1)}50%{transform:translateX(-18%) scale(.96,.98)}100%{transform:translateX(-50%) scaleY(1)}}

    /* =================================================================
       迭代二：器械动作细节化（戴手套的手 + 多段式动作编排）
       ================================================================= */
    .rig{position:absolute;z-index:6;opacity:0;pointer-events:none}
    .rig.show{opacity:1}
    .hand{position:relative;width:106px;height:74px;filter:drop-shadow(0 10px 14px rgba(50,80,105,.24))}
    .hand>*{position:absolute}
    .hand .sleeve{right:0;top:19px;width:56px;height:36px;border-radius:8px 24px 24px 8px;background:linear-gradient(180deg,#ffffff,#dde6ea);box-shadow:inset 0 -6px 12px rgba(120,150,165,.22),0 6px 12px rgba(60,90,110,.10)}
    .hand .sleeve::after{content:"";position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(90deg,rgba(140,168,184,.10) 0 2px,transparent 2px 10px)}
    .hand .cuff{right:48px;top:15px;width:15px;height:44px;border-radius:7px;background:linear-gradient(180deg,#eaf7fc,#9fcde1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.8),inset -2px 0 5px rgba(90,140,160,.28)}
    .hand .mid{right:56px;top:19px;width:30px;height:12px;border-radius:8px;background:linear-gradient(180deg,#ffffff,#e9f1f5);transform:rotate(-4deg);transform-origin:100% 50%;opacity:.92;z-index:-1}
    .hand .palm{right:52px;top:10px;width:44px;height:50px;border-radius:20px 22px 22px 22px;background:linear-gradient(180deg,#ffffff,#e6eef2);box-shadow:inset -6px 0 12px rgba(120,150,165,.24),inset 3px 3px 6px rgba(255,255,255,.9)}
    .hand .palm::after{content:"";position:absolute;left:9px;top:13px;width:3px;height:26px;border-radius:3px;background:rgba(150,178,192,.26);box-shadow:10px 0 0 rgba(150,178,192,.18)}
    .hand .thumb{right:58px;top:2px;width:34px;height:15px;border-radius:9px;background:linear-gradient(180deg,#ffffff,#edf4f7);transform:rotate(-16deg);transform-origin:100% 50%;box-shadow:0 3px 7px rgba(60,90,110,.22)}
    .hand .thumb::after{content:"";position:absolute;left:-11px;top:1px;width:15px;height:14px;border-radius:60% 45% 45% 60%;background:linear-gradient(180deg,#ffffff,#e9f1f5);box-shadow:inset 0 -2px 4px rgba(120,150,165,.22)}
    .hand .finger{right:58px;top:34px;width:36px;height:15px;border-radius:9px;background:linear-gradient(180deg,#ffffff,#edf4f7);transform:rotate(13deg);transform-origin:100% 50%;box-shadow:0 3px 7px rgba(60,90,110,.22)}
    .hand .finger::after{content:"";position:absolute;left:-11px;bottom:1px;width:15px;height:14px;border-radius:45% 60% 60% 45%;background:linear-gradient(180deg,#ffffff,#e9f1f5);box-shadow:inset 0 2px 4px rgba(120,150,165,.22)}
    .hand .tool{right:46px;top:30px;transform-origin:100% 50%}
    .t-scalpel{width:120px;height:9px;border-radius:3px;background:linear-gradient(90deg,#7d8b95 0 60%,#c2ced5 60% 84%,#8d9aa4 84%);box-shadow:0 3px 6px rgba(40,60,75,.32)}
    .t-scalpel::after{content:"";position:absolute;left:-20px;top:-5px;border-right:22px solid #d5e0e6;border-top:9px solid transparent;border-bottom:9px solid transparent;filter:drop-shadow(0 2px 2px rgba(40,60,75,.25))}
    .t-tweezers{width:104px;height:16px}
    .t-tweezers i{position:absolute;left:0;width:100%;height:3px;border-radius:2px;background:linear-gradient(90deg,#9fb0bb,#dbe5ea);box-shadow:0 1px 2px rgba(50,70,90,.25);z-index:3}
    .t-tweezers i:nth-child(1){top:2px;transform:rotate(-2deg);transform-origin:100% 50%}
    .t-tweezers i:nth-child(2){top:11px;transform:rotate(2deg);transform-origin:100% 50%}
    .t-lens{width:78px;height:78px}
    .t-lens .ring{position:absolute;left:0;top:0;width:64px;height:64px;border-radius:50%;border:6px solid #cbd7de;background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.9),rgba(190,225,240,.32));box-shadow:0 6px 12px rgba(50,80,105,.22),inset 0 0 18px rgba(255,255,255,.7)}
    .t-lens .grip{position:absolute;right:0;bottom:0;width:30px;height:11px;border-radius:6px;background:linear-gradient(90deg,#8ea0ab,#c3cfd6);transform:rotate(42deg);transform-origin:0 50%}
    .t-spray{width:66px;height:106px}
    .t-spray .body{position:absolute;left:13px;top:28px;width:40px;height:78px;border-radius:8px 8px 12px 12px;background:linear-gradient(90deg,rgba(226,240,246,.92),rgba(255,255,255,.97));border:1px solid rgba(150,180,190,.6);box-shadow:inset -6px 0 10px rgba(120,160,175,.2),0 8px 14px rgba(60,90,110,.2)}
    .t-spray .body::after{content:"";position:absolute;left:3px;right:3px;bottom:3px;height:56%;border-radius:6px 6px 10px 10px;background:linear-gradient(180deg,rgba(150,205,230,.35),rgba(90,170,210,.5))}
    .t-spray .noz{position:absolute;left:14px;top:9px;width:38px;height:19px;border-radius:5px;background:linear-gradient(180deg,#3f93d3,#1f6cae);box-shadow:0 3px 6px rgba(20,80,135,.3)}
    .t-spray .noz::after{content:"";position:absolute;left:-10px;top:5px;width:13px;height:9px;border-radius:0 3px 3px 0;background:linear-gradient(90deg,#2b6f9f,#5aa6d8)}

    /* 阶段 1：固定道具绝对定位（便于与手持器械对位） */
    .stage-tissue{position:absolute;inset:0;z-index:2}
    .stage-tissue .cut-board{position:absolute;left:4%;top:20%;width:min(250px,25%);aspect-ratio:260/170}
    .stage-tissue .petri{position:absolute;left:34%;top:44%;width:168px;height:60px}
    .stage-tissue .mist{left:19%;top:30%;width:32%;height:44%}
    .rig-lens{left:41%;top:26%}
    .rig-spray{left:43%;top:12%}
    .rig-knife{left:27.5%;top:37%}
    .rig-ster{left:41%;top:15%}

    /* 表面消毒：酒精 / 次氯酸钙 / 无菌水 浸洗瓶 */
    .tank{position:absolute;width:48px;height:60px}
    .tank .glass{position:absolute;inset:0;border-radius:6px 6px 13px 13px;background:linear-gradient(90deg,rgba(255,255,255,.5),rgba(210,232,240,.3));border:2px solid rgba(255,255,255,.92);box-shadow:inset 4px 0 8px rgba(255,255,255,.6),inset -7px 0 12px rgba(120,150,165,.22),0 10px 16px rgba(60,90,110,.18);overflow:hidden}
    .tank .liquid{position:absolute;left:2px;right:2px;bottom:2px;height:64%;border-radius:5px 5px 11px 11px}
    .tank.alcohol .liquid{background:linear-gradient(180deg,rgba(188,224,245,.75),rgba(112,186,224,.85))}
    .tank.naocl .liquid{background:linear-gradient(180deg,rgba(232,240,222,.82),rgba(184,207,166,.86))}
    .tank.water .liquid{background:linear-gradient(180deg,rgba(214,240,250,.85),rgba(144,208,236,.9))}
    .tank .bub{position:absolute;bottom:8%;left:20%;width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.92);opacity:0}
    .tank .bub:nth-child(2){left:42%;bottom:12%}
    .tank .bub:nth-child(3){left:62%;bottom:6%}
    .tank .bub:nth-child(4){left:78%;bottom:14%}
    .tank.active .bub{animation:bubUp 1.1s linear infinite}
    .tank.active .bub:nth-child(2){animation-delay:.25s}
    .tank.active .bub:nth-child(3){animation-delay:.5s}
    .tank.active .bub:nth-child(4){animation-delay:.8s}
    .tank .tag{position:absolute;left:50%;bottom:-20px;transform:translateX(-50%);white-space:nowrap;font-size:9px;font-weight:800;color:#3d5a6b;background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.9);border-radius:5px;padding:2px 5px;box-shadow:0 4px 8px rgba(60,90,110,.1)}
    .tank.low .tag{bottom:-36px}
    .tank .tick{position:absolute;left:50%;top:-17px;transform:translateX(-50%);white-space:nowrap;font-size:10px;font-weight:800;color:#fff;background:rgba(62,155,90,.92);border-radius:6px;padding:2px 7px;opacity:0;transition:.3s}
    .tank.active .tick{opacity:1}
    .tk1{left:54%;top:40%}.tk2{left:60%;top:40%}.tk3{left:66%;top:40%}.tk4{left:72%;top:40%}.tk5{left:78%;top:40%}
    @keyframes bubUp{0%{opacity:0;transform:translateY(0) scale(.5)}25%{opacity:.95}100%{opacity:0;transform:translateY(-38px) scale(1.15)}}
    .t-tweezers .chip{position:absolute;left:-2px;top:4px;width:16px;height:12px;border-radius:2px;background:linear-gradient(145deg,#ffe0a0,#f0a13c);box-shadow:0 2px 4px rgba(140,90,20,.35)}
    @keyframes sterilizeSeq{
      0%{opacity:0;transform:translate(0,-46px) rotate(6deg)}
      6%{opacity:1;transform:translate(0,0) rotate(4deg)}
      14%{transform:translate(193px,-10px) rotate(4deg)}
      21%{transform:translate(193px,136px) rotate(2deg)}
      28%{transform:translate(193px,-12px) rotate(4deg)}
      36%{transform:translate(251px,-10px) rotate(4deg)}
      43%{transform:translate(251px,136px) rotate(2deg)}
      50%{transform:translate(251px,-12px) rotate(4deg)}
      58%{transform:translate(309px,-10px) rotate(4deg)}
      64%{transform:translate(309px,128px) rotate(2deg)}
      70%{transform:translate(309px,-12px) rotate(4deg)}
      76%{transform:translate(367px,-10px) rotate(4deg)}
      82%{transform:translate(367px,128px) rotate(2deg)}
      87%{transform:translate(367px,-12px) rotate(4deg)}
      93%{opacity:1;transform:translate(425px,-10px) rotate(4deg)}
      97%{opacity:1;transform:translate(425px,128px) rotate(2deg)}
      100%{opacity:0;transform:translate(425px,-30px) rotate(6deg)}
    }
    .rig-ster.acting{animation:sterilizeSeq 10s cubic-bezier(.3,.05,.25,1) forwards}
    .slice-ring.picked{animation:sliceScan 2.4s ease;box-shadow:0 0 0 7px rgba(62,155,90,.18),0 18px 30px rgba(153,91,20,.2)}
    .slice-ring.picked::before{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(105deg,transparent 36%,rgba(255,255,255,.8) 50%,transparent 64%);animation:scanSweep 1.2s ease-in-out 2}
    @keyframes sliceScan{0%{transform:scale(.92)}22%{transform:scale(1.02)}45%{transform:scale(1.18)}72%{transform:scale(1.18)}100%{transform:scale(1.08)}}
    @keyframes scanSweep{from{transform:translateX(-105%)}to{transform:translateX(105%)}}
    .rig-cap{left:16%;top:2%}
    .rig-plant{left:54%;top:4%}

    /* 阶段 2：台内器械 */
    .bench-interior .rig-twflame{left:29%;top:46%}
    .bench-interior .rig-twpick{left:75%;top:44%}

    /* 阶段 5：驯化罩百叶、入盆苗 */
    .dome-vent{position:absolute;left:50%;top:14px;transform:translateX(-50%);display:flex;gap:5px}
    .dome-vent i{width:16px;height:5px;border-radius:3px;background:linear-gradient(180deg,#bcd7e3,#8fb3c2);transition:transform .6s ease}
    .humidity-dome.open .dome-vent i:nth-child(1){transform:rotate(-26deg)}
    .humidity-dome.open .dome-vent i:nth-child(2){transform:rotate(0)}
    .humidity-dome.open .dome-vent i:nth-child(3){transform:rotate(26deg)}
    .pot-plant{position:absolute;left:50%;bottom:46%;transform:translateX(-50%) scale(0);transform-origin:50% 100%;transition:transform .9s cubic-bezier(.2,1.35,.4,1);z-index:3}
    .pot-plant.in{transform:translateX(-50%) scale(.44)}
    .tube-cap2{position:absolute;left:-4px;right:-4px;top:-13px;height:22px;border-radius:8px;background:linear-gradient(180deg,#3f93d3,#1f6cae);box-shadow:0 4px 8px rgba(20,80,135,.35);transform-origin:70% 100%;transition:transform .7s cubic-bezier(.3,.9,.3,1);z-index:4}
    .tube-cap2.open{transform:translate(42px,-40px) rotate(46deg)}

    /* 芽展开与根系伸展 */
    .bud::before,.bud::after{content:"";position:absolute;left:50%;bottom:88%;width:10px;height:12px;border-radius:100% 0 100% 0;background:linear-gradient(135deg,#a6e06d,#3e9b5a);transform-origin:bottom center;transform:scale(0);transition:transform .55s cubic-bezier(.3,1.3,.5,1)}
    .bud::after{transform:scale(0) scaleX(-1)}
    .bud.show::before{transform:rotate(-28deg)}
    .bud.show::after{transform:rotate(28deg) scaleX(-1)}
    .plantlet.rooted .root-bundle{animation:rootsOut .9s cubic-bezier(.3,1,.4,1) both}
    @keyframes rootsOut{from{transform:scaleY(0)}to{transform:scaleY(1)}}
    .plantlet.grow .plant-stem{animation:stemUp 1.6s cubic-bezier(.2,1,.3,1) both;transform-origin:50% 100%}
    @keyframes stemUp{from{transform:scaleY(.1)}to{transform:scaleY(1)}}

    /* ================= 动作关键帧 ================= */
    @keyframes knifeCut{
      0%{opacity:0;transform:translate(58px,-42px) rotate(17deg)}
      10%{opacity:1}
      26%{transform:translate(6px,-6px) rotate(5deg)}
      40%{transform:translate(0,0) rotate(0)}
      54%{transform:translate(-6px,30px) rotate(-2deg)}
      70%{transform:translate(-13px,34px) rotate(-3deg)}
      84%{opacity:1;transform:translate(-6px,14px) rotate(-5deg)}
      100%{opacity:0;transform:translate(50px,-34px) rotate(15deg)}
    }
    .rig-knife.cutting{animation:knifeCut 2.8s cubic-bezier(.35,.05,.2,1) forwards}
    @keyframes lensScan{
      0%{opacity:0;transform:translate(62px,-26px)}
      14%{opacity:1}
      34%{transform:translate(0,0)}
      48%{transform:translate(-3px,7px)}
      64%{opacity:1;transform:translate(-1px,2px)}
      100%{opacity:0;transform:translate(54px,-22px)}
    }
    .rig-lens.scanning{animation:lensScan 2.4s ease-in-out forwards}
    @keyframes spraySeq{
      0%{opacity:0;transform:translate(52px,-20px)}
      14%{opacity:1;transform:translate(0,0)}
      22%{transform:translate(0,0) rotate(0)}
      30%{transform:translate(-4px,2px) rotate(-8deg)}
      38%{transform:translate(0,0) rotate(0)}
      46%{transform:translate(-4px,2px) rotate(-8deg)}
      54%{transform:translate(0,0) rotate(0)}
      62%{transform:translate(-4px,2px) rotate(-8deg)}
      70%{opacity:1;transform:translate(0,0) rotate(0)}
      100%{opacity:0;transform:translate(46px,-16px)}
    }
    .rig-spray.spraying{animation:spraySeq 2.8s ease-in-out forwards}
    @keyframes twFlame{
      0%{opacity:0;transform:translate(34px,-16px) rotate(8deg)}
      16%{opacity:1}
      34%{transform:translate(0,0) rotate(0)}
      46%{transform:translate(-6px,14px) rotate(-12deg)}
      58%{transform:translate(-10px,26px) rotate(-18deg)}
      74%{transform:translate(-10px,26px) rotate(-18deg)}
      88%{opacity:1;transform:translate(-2px,4px) rotate(-4deg)}
      100%{opacity:0;transform:translate(30px,-14px) rotate(8deg)}
    }
    .rig-twflame.acting{animation:twFlame 3.2s cubic-bezier(.3,.05,.25,1) forwards}
    @keyframes twPick{
      0%{opacity:0;transform:translate(46px,-26px) rotate(10deg)}
      12%{opacity:1}
      30%{transform:translate(0,-6px) rotate(0)}
      46%{transform:translate(0,14px) rotate(-4deg)}
      60%{transform:translate(0,26px) rotate(-6deg)}
      74%{opacity:1;transform:translate(0,26px) rotate(-6deg)}
      88%{opacity:1;transform:translate(0,-4px) rotate(-2deg)}
      100%{opacity:0;transform:translate(40px,-22px) rotate(10deg)}
    }
    .rig-twpick.acting{animation:twPick 3.6s cubic-bezier(.3,.05,.25,1) forwards}
    .tw-tip.hot{background:linear-gradient(90deg,#ffb43c,#ff5a1e);box-shadow:0 0 18px rgba(255,110,40,.98)}
    .steam{position:absolute;left:50%;bottom:100%;width:26px;height:34px;transform:translateX(-50%);opacity:0}
    .steam.on{animation:steamUp 1.1s ease-out 2}
    @keyframes steamUp{0%{opacity:0;transform:translateX(-50%) translateY(6px) scale(.6)}30%{opacity:.85}100%{opacity:0;transform:translateX(-50%) translateY(-20px) scale(1.3)}}
    .ripple{position:absolute;left:50%;bottom:8px;width:12px;height:12px;margin-left:-6px;border-radius:50%;border:2px solid rgba(240,200,90,.85);opacity:0}
    .ripple.on{animation:rippleOut .9s ease-out}
    @keyframes rippleOut{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(2.6)}}
    .tissue-half{position:absolute;left:50%;bottom:16px;width:14px;height:14px;margin-left:-14px;border-radius:3px;background:linear-gradient(145deg,#ffd88a,#f2a53c);opacity:0}
    .tissue-half.b{left:50%;margin-left:0}
    .tissue-half.split{animation:halfDrop .9s cubic-bezier(.3,1.2,.5,1) forwards}
    .tissue-half.b.split{animation-delay:.08s}
    @keyframes halfDrop{0%{opacity:0;transform:translateY(-22px) rotate(-30deg) scale(.7)}70%{opacity:1;transform:translateY(2px) rotate(6deg) scale(1)}100%{opacity:1;transform:translateY(0) rotate(0) scale(1)}}

    @keyframes handReach{
      0%{opacity:0;transform:translate(40px,-30px)}
      16%{opacity:1}
      40%{transform:translate(0,0)}
      62%{opacity:1;transform:translate(-6px,10px)}
      100%{opacity:0;transform:translate(34px,-24px)}
    }
    .rig-cap.acting,.rig-plant.acting{animation:handReach 3s cubic-bezier(.3,.05,.25,1) forwards}
    .t-tweezers i.hot{background:linear-gradient(90deg,#ffe0a0 0,#ff6a1e 20px,#d7e0e5 28px,#f2f7f9 100%);filter:drop-shadow(0 0 5px rgba(255,130,40,.85))}
    .t-tweezers i.cool{background:linear-gradient(90deg,#cfdae0,#f2f7f9)}

    /* =================================================================
       迭代三：紫外流程 / 手套挑选 / 整块消毒 / 解剖刀 / 降饱和写实
       ================================================================= */
    .uv-haze{position:absolute;inset:0;z-index:7;pointer-events:none;opacity:0;transition:opacity .6s ease;
      background:radial-gradient(62% 52% at 50% 42%,rgba(146,102,226,.34),rgba(108,72,178,.16) 62%,transparent 82%)}
    .lab-room.uv .uv-haze{opacity:1}
    .uv-timer{position:absolute;left:12px;top:10px;z-index:9;font-size:11px;font-weight:800;color:#ece2ff;
      background:rgba(84,56,146,.86);border:1px solid rgba(186,156,255,.55);border-radius:8px;padding:4px 11px;opacity:0;transition:.3s}
    .uv-timer.on{opacity:1}
    .uv-timer.on::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#b98cff;margin-right:6px;vertical-align:middle;box-shadow:0 0 10px #b98cff;animation:uvGlow 1.2s ease-in-out infinite}
    .workbench.uv-mode .wb-opening::after{content:"";position:absolute;inset:0;z-index:7;pointer-events:none;background:linear-gradient(180deg,rgba(150,104,228,.30),rgba(120,80,196,.22))}
    .workbench.uv-mode .uv-lamp{background:linear-gradient(180deg,#f2e6ff,#a679f0);box-shadow:0 0 26px rgba(172,124,255,.95),0 0 58px rgba(172,124,255,.55);animation:uvGlow 1.6s ease-in-out infinite}
    .workbench.uv-mode .led-uv{background:#b98cff;box-shadow:0 0 10px #b98cff}
    .workbench.uv-mode .led-power{background:#4fd07a;box-shadow:0 0 8px rgba(79,208,122,.8)}

    /* 手套挑选（单指前伸） */
    .hand.point .thumb{display:none}
    .hand.point .finger{right:26px;top:22px;width:80px;height:15px;border-radius:8px;transform:rotate(-4deg)}
    .hand.point .finger::after{left:-12px;bottom:0;width:16px;height:15px}
    .rig-hand{left:19%;top:31%}
    @keyframes handPoint{
      0%{opacity:0;transform:translate(72px,-16px)}
      12%{opacity:1}
      28%{transform:translate(0,0)}
      38%{transform:translate(-9px,9px)}
      48%{transform:translate(0,0)}
      58%{transform:translate(-9px,9px)}
      68%{opacity:1;transform:translate(0,0)}
      88%{opacity:1;transform:translate(0,0)}
      100%{opacity:0;transform:translate(66px,-12px)}
    }
    .rig-hand.acting{animation:handPoint 2.8s cubic-bezier(.3,.05,.25,1) forwards}

    /* 整块韧皮部（薄片） */
    .phloem-slab{width:52px;height:26px;border-radius:3px;background:linear-gradient(180deg,#f7c977,#dd9526);
      box-shadow:0 4px 8px rgba(130,85,20,.28),inset 0 -7px 10px rgba(190,125,30,.35);transition:opacity .3s ease;position:relative}
    .phloem-slab::after{content:"";position:absolute;inset:4px 8px;border-radius:2px;background:rgba(255,240,205,.5)}
    .phloem-slab.gone{opacity:0}
    .stage-tissue .phloem-slab{position:absolute;left:18.9%;top:42%}
    .t-tweezers .slab{position:absolute;left:-11px;top:0;width:48px;height:24px;z-index:1}

    /* 切成的小块 */
    .blk{position:absolute;width:16px;height:13px;border-radius:2px;background:linear-gradient(150deg,#f9d894,#e09b2c);box-shadow:0 2px 4px rgba(140,90,20,.3);opacity:0}
    .blk.in{animation:blkDrop .6s cubic-bezier(.3,1.2,.5,1) forwards}
    .blk.b1{left:40%;bottom:15px}
    .blk.b2{left:55%;bottom:18px;animation-delay:.15s}
    .blk.b3{left:69%;bottom:14px;animation-delay:.3s}
    @keyframes blkDrop{0%{opacity:0;transform:translateY(-18px) scale(.7)}70%{opacity:1;transform:translateY(1px) scale(1)}100%{opacity:1;transform:translateY(0) scale(1)}}

    /* 解剖刀（金属手柄 + #11 刀片） */
    .t-scalpel{width:118px;height:10px;border-radius:2px;background:linear-gradient(180deg,#d6dee3,#96a3ad 62%,#7a8792);box-shadow:0 2px 4px rgba(40,60,75,.3)}
    .t-scalpel::before{content:"";position:absolute;right:30px;top:3px;width:3px;height:4px;border-radius:1px;background:rgba(255,255,255,.4);box-shadow:7px 0 0 rgba(255,255,255,.34),14px 0 0 rgba(255,255,255,.28),21px 0 0 rgba(255,255,255,.22)}
    .t-scalpel::after{content:"";position:absolute;left:-26px;top:-4px;width:28px;height:18px;background:linear-gradient(120deg,#eef3f6,#a9b6bf 68%);clip-path:polygon(0 50%,100% 0,100% 100%);filter:drop-shadow(0 1px 1px rgba(40,60,75,.35))}

    /* 风格下调：标签 / 底板 / 选中态 去卡通化 */
    .scene-label{font-size:12px;color:#41525e;background:rgba(240,245,248,.92);border:1px solid rgba(126,150,164,.38);border-radius:6px;box-shadow:0 4px 10px rgba(60,80,95,.12)}
    .slice-ring::after{background:linear-gradient(180deg,#4a86ad,#2f6289);color:#eaf4fa;border-radius:6px;font-weight:800;box-shadow:0 4px 10px rgba(40,80,110,.25)}
    .d-item.target::after{background:linear-gradient(180deg,#4a86ad,#2f6289);box-shadow:0 4px 10px rgba(40,80,110,.3)}
    .d-item.target{outline-color:rgba(74,134,173,.92)}
    @keyframes tgtPulse{0%,100%{outline-color:rgba(74,134,173,.92)}50%{outline-color:rgba(74,134,173,.28)}}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(74,134,173,.14),0 12px 25px rgba(60,80,95,.14)}50%{box-shadow:0 0 0 12px rgba(74,134,173,.20),0 12px 25px rgba(60,80,95,.18)}}
    .stage-tissue .cut-board{background:linear-gradient(180deg,#eef2f4,#d7dfe4);box-shadow:0 12px 22px rgba(55,80,100,.18),inset 0 0 0 1px rgba(255,255,255,.9),inset 0 0 0 5px rgba(196,208,216,.35)}
    .tank.alcohol .liquid{background:linear-gradient(180deg,rgba(198,222,236,.72),rgba(148,188,214,.82))}
    .tank.naocl .liquid{background:linear-gradient(180deg,rgba(232,240,222,.82),rgba(184,207,166,.86))}
    .tank.water .liquid{background:linear-gradient(180deg,rgba(216,234,244,.82),rgba(168,204,226,.86))}
    .bud::before,.bud::after{background:linear-gradient(135deg,#9ed170,#3e8f57)}

    /* 镊子：只烫尖端，手柄仍由手套握持 */
    .t-tweezers .tw-tip{position:absolute;left:-2px;top:0;width:16px;height:16px}
    .t-tweezers .tw-tip::before,.t-tweezers .tw-tip::after{content:"";position:absolute;left:0;width:16px;height:4px;border-radius:2px;background:linear-gradient(90deg,#dde5ea,#c2cdd5);transition:background .35s ease,box-shadow .35s ease}
    .t-tweezers .tw-tip::before{top:2px}
    .t-tweezers .tw-tip::after{top:11px}
    .t-tweezers .tw-tip.hot::before,.t-tweezers .tw-tip.hot::after{background:linear-gradient(90deg,#ffe9a8,#ff6a1e);box-shadow:0 0 12px rgba(255,140,40,.95),0 0 24px rgba(255,90,20,.5)}
    .steam3{position:absolute;left:-8px;top:-32px;width:26px;height:28px;opacity:0;pointer-events:none}
    .steam3::before,.steam3::after{content:"";position:absolute;bottom:0;width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.88);filter:blur(2px)}
    .steam3::before{left:2px}
    .steam3::after{left:12px}
    .steam3.on{animation:steamRise 1.1s ease-out 2}
    @keyframes steamRise{0%{opacity:0;transform:translateY(6px) scale(.6)}30%{opacity:.9}100%{opacity:0;transform:translateY(-22px) scale(1.3)}}

    /* 阶段 5：整株试管苗取出移栽 */
    .acclim-stage .testtube{overflow:visible}
    .acclim-stage .plantlet.gone{opacity:0}
    @keyframes plantMove{
      0%{transform:translateX(-50%) translate(0,0) rotate(0)}
      18%{transform:translateX(-50%) translate(0,-20px) rotate(-4deg)}
      55%{transform:translateX(-50%) translate(100px,-38px) rotate(6deg)}
      100%{transform:translateX(-50%) translate(186px,6px) rotate(0)}
    }
    .acclim-stage .plantlet.taken{animation:plantMove 2.6s cubic-bezier(.35,.05,.25,1) forwards}
    .cool-chip{position:absolute;left:50%;top:-20px;transform:translateX(-50%);white-space:nowrap;font-size:10px;font-weight:800;color:#3d5a6b;background:rgba(255,255,255,.92);border:1px solid rgba(126,150,164,.4);border-radius:6px;padding:2px 8px;opacity:0;transition:.3s}
    .cool-chip.on{opacity:1}

    /* ===== 迭代四：按视频真实流程重排：流水冲洗 → 75%酒精30s → 10%次氯酸钙10min → 无菌水循环冲洗3次 → 滤纸吸干 → 切取内部组织 ===== */
    .stage-tissue .cut-board{left:1.5%;width:min(240px,25%)}
    .stage-tissue .petri{left:27%;top:49%;width:120px;height:44px}
    .stage-tissue .phloem-slab{left:16%;top:40%}
    .tank{width:48px;height:56px}
    .tk1{left:50%;top:46%}.tk2{left:61%;top:46%}.tk3{left:72%;top:46%}
    .tank .tag{font-size:8.5px;padding:2px 4px}
    .rig-ster{left:36%;top:15%}
    .blk::after{content:"";position:absolute;inset:3px;border-radius:1px;background:rgba(255,248,226,.8)}

    /* 流水冲洗台 */
    .rinse-station{position:absolute;left:38%;top:22%;width:74px;height:200px}
    .rinse-station i{position:absolute}
    .rinse-station .pipe{left:50%;top:0;width:10px;height:52px;border-radius:4px;background:linear-gradient(90deg,#c6d2d9,#eff4f6);transform:translateX(-50%)}
    .rinse-station .spout{left:50%;top:48px;width:36px;height:10px;border-radius:5px;background:linear-gradient(180deg,#dbe4e9,#b4c2cb);transform:translateX(-54%)}
    .rinse-station .stream{left:50%;top:56px;width:8px;height:108px;border-radius:4px;transform:translateX(-50%);background:linear-gradient(180deg,rgba(150,205,235,.92),rgba(120,190,225,.35));opacity:0;transition:opacity .25s}
    .rinse-station.on .stream{opacity:1}
    .rinse-station .basin{left:50%;bottom:6px;width:66px;height:26px;border-radius:6px 6px 15px 15px;background:linear-gradient(180deg,rgba(245,250,252,.95),rgba(210,227,236,.95));border:2px solid rgba(255,255,255,.92);transform:translateX(-50%);box-shadow:0 8px 14px rgba(60,90,110,.16),inset 0 -5px 9px rgba(150,180,195,.22)}

    /* （按需求已移除无菌滤纸） */

    @keyframes rinseSeq{
      0%{opacity:0;left:calc(16% + 55px);top:calc(40% - 30px)}
      8%{opacity:1;left:calc(16% + 55px);top:calc(40% - 30px)}
      30%{left:calc(38% + 63px);top:calc(22% + 131px)}
      68%{left:calc(38% + 63px);top:calc(22% + 131px)}
      88%{opacity:1;left:calc(16% + 55px);top:calc(40% - 30px)}
      100%{opacity:0;left:calc(16% + 55px);top:calc(40% - 30px)}
    }
    .rig-ster.rinse{animation:rinseSeq 3.8s cubic-bezier(.3,.05,.25,1) forwards}

    @keyframes sterilizeSeq{
      0%{opacity:0;left:calc(16% + 55px);top:calc(40% - 30px)}
      6%{opacity:1;left:calc(16% + 55px);top:calc(40% - 30px)}
      14%{left:calc(50% + 55px);top:calc(46% - 70px)}
      22%{left:calc(50% + 55px);top:calc(46% - 18px)}
      34%{left:calc(50% + 55px);top:calc(46% - 70px)}
      44%{left:calc(61% + 55px);top:calc(46% - 70px)}
      52%{left:calc(61% + 55px);top:calc(46% - 18px)}
      64%{left:calc(61% + 55px);top:calc(46% - 70px)}
      72%{left:calc(72% + 55px);top:calc(46% - 70px)}
      80%{left:calc(72% + 55px);top:calc(46% - 18px)}
      88%{left:calc(72% + 55px);top:calc(46% - 70px)}
      96%{opacity:1;left:calc(16% + 55px);top:calc(40% - 30px)}
      100%{opacity:0;left:calc(16% + 55px);top:calc(40% - 30px)}
    }
    .rig-ster.acting{animation:sterilizeSeq 5.4s cubic-bezier(.3,.05,.25,1) forwards}

    /* ===== 为讲清“细胞全能性”补的三块可视化 ===== */
    /* 阶段1：韧皮部细胞特写（已高度分化） */
    .phloem-view{position:absolute;right:2%;top:5%;width:196px;padding:9px 11px 10px;border-radius:13px;background:rgba(255,255,255,.94);border:1px solid rgba(120,150,165,.3);box-shadow:0 10px 20px rgba(60,90,110,.15);z-index:3}
    .phloem-view .pv-title{font-size:11px;font-weight:800;color:#3d5a6b;margin-bottom:6px}
    .phloem-view .pv-cells{display:flex;gap:4px;align-items:flex-end;height:54px}
    .phloem-view .pv-cells i{flex:1;border-radius:7px;background:linear-gradient(180deg,#f7d79a,#e0a63f);border:1px solid rgba(160,110,30,.35)}
    .phloem-view .pv-cells i:nth-child(odd){height:100%}
    .phloem-view .pv-cells i:nth-child(even){height:86%}
    .phloem-view .pv-note{margin-top:7px;font-size:10.5px;color:#7d8f9b;line-height:1.5}
    .phloem-view .pv-note b{color:#c0392b}

    /* 阶段3：细胞状态说明 */
    .cell-caption{margin-top:2px;font-size:11.5px;font-weight:700;color:#3d5a6b;text-align:center;max-width:260px;line-height:1.5}
    .cell-caption b{color:#c0392b}

    /* 阶段6：证据链 */
    .evidence-chain{position:absolute;left:5%;right:23%;top:3.5%;display:flex;align-items:center;justify-content:center;gap:4px;z-index:3;flex-wrap:wrap}
    .ev-node{padding:4px 7px;border-radius:10px;background:rgba(255,255,255,.94);border:1px solid rgba(120,150,165,.3);font-size:10.5px;font-weight:800;color:#8095a1;box-shadow:0 6px 12px rgba(60,90,110,.1);opacity:.55;transition:.5s}
    .ev-node small{display:block;font-size:9px;font-weight:600;color:#9aa9b3;margin-top:1px}
    .ev-node.done{color:#286d3d;border-color:rgba(62,155,90,.55);opacity:1;background:rgba(240,250,243,.96)}
    .ev-node.done small{color:#5b8f6c}
    .ev-arrow{color:#9fb3bf;font-weight:900;font-size:13px}

    /* 阶段6：结论 + 条件对照 */
    .ev-bottom{position:absolute;left:3%;right:3%;bottom:2.5%;display:flex;flex-direction:column;gap:7px;z-index:3}
    .ev-conclusion{text-align:center;padding:8px 12px;border-radius:12px;background:linear-gradient(90deg,rgba(62,155,90,.10),rgba(62,155,90,.22));border:1px dashed rgba(62,155,90,.55);font-size:12px;font-weight:800;color:#20612f;opacity:.5;transition:.7s}
    .ev-conclusion.show{opacity:1}
    .ev-conclusion b{color:#0f7a35}
    .cond-cards{display:flex;gap:9px;justify-content:center}
    .cond-card{flex:1;max-width:250px;padding:7px 9px;border-radius:11px;background:rgba(255,255,255,.95);border:1px solid rgba(200,120,90,.35);box-shadow:0 8px 16px rgba(90,60,40,.12)}
    .cond-card b{display:block;font-size:11px;color:#b3452b;margin-bottom:2px}
    .cond-card span{font-size:10px;color:#6d7c87;line-height:1.45}
    .final-stage{padding:12% 8% 32%;transform:scale(.82)}

    @media(max-width:1050px){.scene{inset:150px 14px 126px}}
    @media(max-width:720px){.scene{inset:158px 10px 150px}.stage-tissue,.callus-stage,.organo-stage,.acclim-stage{gap:3%;padding:16% 4% 14%}.env-chip{font-size:11px;padding:4px 8px}.wb-ctl b{display:none}}


    /* ================= v3：教学信息层级与交互可用性增强 ================= */
    :focus-visible{outline:3px solid rgba(77,140,168,.45);outline-offset:3px}
    .stage-tab:focus-visible,.btn:focus-visible,.step:focus-visible,.quiz-option:focus-visible{outline-color:rgba(62,155,90,.5)}
    .knowledge{position:relative;overflow:hidden}
    .knowledge::after{content:"";position:absolute;right:-36px;bottom:-42px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,rgba(245,166,35,.11),transparent 68%);pointer-events:none}
    .knowledge li+li{margin-top:5px}
    .knowledge li::marker{color:var(--green)}

    .ms-panel{position:absolute;left:4%;top:9%;width:270px;padding:13px 14px;border-radius:16px;background:rgba(252,254,255,.88);border:1px solid rgba(255,255,255,.96);box-shadow:0 14px 30px rgba(45,70,90,.16);backdrop-filter:blur(12px);z-index:6;transition:.35s ease}
    .ms-panel.pulse-panel{animation:panelPulse 1.7s ease-in-out infinite}
    .ms-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
    .ms-head b{font-size:13px;color:#294451}.ms-head span{font-size:10px;font-weight:900;color:#fff;background:linear-gradient(135deg,var(--green),#2f7f49);padding:4px 7px;border-radius:99px}
    .ms-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
    .ms-item{padding:7px 8px;border-radius:9px;background:linear-gradient(180deg,#f7fafb,#edf3f5);border:1px solid #e0e7eb;min-height:48px}
    .ms-item strong{display:block;font-size:11px;color:#2d4a59;margin-bottom:2px}.ms-item small{display:block;font-size:9.5px;color:#70808b;line-height:1.35}
    .ms-item.hormone{grid-column:1/-1;background:linear-gradient(90deg,rgba(126,200,80,.11),rgba(245,166,35,.10))}
    .ms-footer{margin-top:7px;font-size:9.5px;color:#6b7a85;line-height:1.45}
    .sterile-badge{position:absolute;right:4%;top:10%;z-index:6;display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:99px;background:rgba(29,54,68,.88);color:#dff6ff;font-size:10px;font-weight:800;box-shadow:0 8px 18px rgba(30,50,65,.18)}
    .sterile-badge i{width:8px;height:8px;border-radius:50%;background:#70d68a;box-shadow:0 0 10px rgba(112,214,138,.8)}

    .hormone-panel{position:absolute;left:50%;top:7%;transform:translateX(-50%);width:min(520px,70%);padding:10px 14px;border-radius:15px;background:rgba(252,254,255,.88);border:1px solid rgba(255,255,255,.96);box-shadow:0 12px 26px rgba(45,70,90,.14);backdrop-filter:blur(12px);z-index:5}
    .hormone-title{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:11px;font-weight:900;color:#38505e;margin-bottom:7px}
    .ratio-track{height:9px;border-radius:99px;background:linear-gradient(90deg,#61a9cf 0 42%,#d7df97 50%,#77bd5a 58% 100%);position:relative;box-shadow:inset 0 1px 3px rgba(50,70,80,.16)}
    .ratio-track::after{content:"";position:absolute;left:50%;top:-4px;width:2px;height:17px;background:#fff;box-shadow:0 0 0 1px rgba(45,70,80,.18)}
    .ratio-labels{display:flex;justify-content:space-between;margin-top:5px;font-size:9.5px;color:#64747f}.ratio-labels b{color:#3d5967}

    .scene-actions .btn[disabled]{filter:grayscale(.35);box-shadow:none}
    .stage-tab.done{border-color:rgba(62,155,90,.18)}
    .stage-tab.active{transform:translateY(-1px)}
    .status-pill{box-shadow:0 5px 14px rgba(60,80,90,.06)}

    @keyframes panelPulse{0%,100%{box-shadow:0 14px 30px rgba(45,70,90,.16),0 0 0 0 rgba(245,166,35,.08)}50%{box-shadow:0 14px 30px rgba(45,70,90,.16),0 0 0 8px rgba(245,166,35,.14)}}

    @media(max-width:1050px){.ms-panel{width:240px}.hormone-panel{width:min(480px,72%)}}
    @media(max-width:720px){.ms-panel{left:2%;top:4%;width:210px;padding:9px}.ms-grid{grid-template-columns:1fr}.ms-item.hormone{grid-column:auto}.ms-footer{display:none}.sterile-badge{right:2%;top:4%}.hormone-panel{top:3%;width:90%;padding:8px 10px}.ratio-labels{font-size:8.5px}}

    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.001ms!important}
    }

  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">🌱</div>
        <div><h1>植物组织培养虚拟实验</h1><p>胡萝卜 · 从细胞到完整植株</p></div>
      </div>
      <div class="progress-area" aria-label="实验总进度">
        <div class="progress-copy"><span id="progressLabel">等待开始</span><strong id="progressPercent">0%</strong></div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      </div>
      <div class="status-pill"><span class="status-dot"></span><span id="labStatus">无菌环境准备中</span></div>
    </header>

    <nav class="stage-nav" id="stageNav" aria-label="实验阶段导航"></nav>

    <section class="workspace">
      <section class="lab-shell" aria-live="polite">
        <div class="lab-head">
          <div><span class="eyebrow" id="stageEyebrow">阶段 0 · 实验准备</span><h2 id="stageTitle">在超净工作台内开始操作</h2><p id="stageDesc">超净工作台用持续洁净气流保护操作区。</p></div>
          <div class="day-chip" id="dayChip">培养第 0 天</div>
        </div>
        <div class="scene" id="scene"></div>
        <div class="scene-actions" id="sceneActions"></div>
        <div class="fast-forward" id="fastForward"><div class="time-wheel"><b id="timeNumber">×10</b><span id="timeText">时间快进</span><div class="time-bars"><i></i><i></i><i></i></div></div></div>
      </section>

      <aside class="side-panel">
        <section class="panel-card">
          <div class="panel-kicker">操作任务</div>
          <h3 id="taskTitle">准备超净工作台</h3>
          <p id="taskCopy">按顺序完成关键操作。橙色脉冲表示当前可操作对象。</p>
          <div class="steps" id="steps"></div>
        </section>
        <section class="panel-card feedback" id="feedback">
          <div class="panel-kicker">实时反馈</div>
          <div class="feedback-line"><div class="feedback-icon" id="feedbackIcon">◎</div><div><strong id="feedbackTitle">等待操作</strong><span id="feedbackText">系统会在这里提示操作结果。</span></div></div>
        </section>
        <section class="panel-card knowledge" id="principleCard">
          <div class="panel-kicker">阶段原理</div>
          <h3 id="principleTitle">关键知识</h3>
          <ul id="principleList"></ul>
        </section>
        <div class="bottom-controls">
          <button class="btn ghost" id="prevBtn">上一阶段</button>
          <button class="btn auto" id="autoBtn">自动演示</button>
          <button class="btn primary" id="nextBtn">下一阶段</button>
        </div>
        <button class="btn ghost" id="resetBtn">重置实验</button>
      </aside>
    </section>
  </main>

  <div class="toast" id="toast" role="status"></div>
  <div class="modal-backdrop" id="quizModal" role="dialog" aria-modal="true" aria-labelledby="quizQuestion">
    <div class="modal">
      <div id="quizQuestion" style="font-weight:800;font-size:15px"></div><div class="quiz-options" id="quizOptions"></div>
      <div id="quizExplain" style="min-height:22px;color:var(--muted);font-size:13px"></div>
      <div class="modal-actions"><button class="btn primary" id="quizContinue" disabled>继续实验</button></div>
    </div>
  </div>
  <div class="modal-backdrop" id="reportModal" role="dialog" aria-modal="true" aria-labelledby="reportTitle">
    <div class="modal report">
      <span class="badge">实验完成</span><h3 id="reportTitle">胡萝卜组织培养实验报告摘要</h3><p>你已完成从外植体细胞到完整植株的再生闭环。</p>
      <div class="report-grid"><div class="report-stat"><b id="reportCompletion">0%</b><span>实验完成度</span></div><div class="report-stat"><b id="reportScore">0/5</b><span>知识测验</span></div><div class="report-stat"><b id="reportErrors">0</b><span>纠错次数</span></div></div>
      <table class="report-table" id="reportTable"></table>
      <div class="modal-actions"><button class="btn ghost" id="printBtn">打印 / 保存报告</button><button class="btn primary" id="closeReport">返回实验台</button></div>
    </div>
  </div>

  <script>
  (() => {
    'use strict';

    /* ============ 阶段数据 ============ */
    const stages = [
      {
        nav:'准备阶段', eyebrow:'阶段 0 · 无菌操作环境', title:'启动超净工作台并完成紫外消毒',
        desc:'先用紫外灯对操作区表面杀菌，再关闭紫外灯、启动风机，形成持续洁净的气流保护。', day:0,
        task:'准备超净工作台', copy:'先开紫外灯消毒，再关灯并确认洁净气流稳定。',
        steps:['打开紫外灯，对操作区消毒 30 min','关闭紫外灯，确认洁净气流稳定'],
        knowledge:['紫外灯可杀灭操作台面及空气中的部分微生物，用于工作前的表面消毒。','紫外线对人眼和皮肤有伤害，操作前必须先关闭紫外灯，再启动风机进入层流状态。'],
        summary:'先用紫外灯消毒、再关灯启动风机，是超净工作台的标准使用顺序。',
        quiz:'组织培养的接种操作为什么要在超净工作台内进行？',
        options:['为了保持温度恒定','为了减少微生物污染','为了增强光照强度'],
        correct:1, explain:'正确。洁净层流能显著降低空气中的微生物污染。'
      },
      {
        nav:'获取外植体', eyebrow:'阶段 1 · 外植体获取', title:'切取胡萝卜韧皮部',
        desc:'从健康胡萝卜根中切取薄而均匀的韧皮部组织，作为外植体。', day:0,
        task:'选择并切取外植体', copy:'器械需事先灭菌；按"流水冲洗 → 消毒 → 吸干 → 无菌切取"进行。',
        steps:['戴手套选取整块韧皮部材料','用流水冲洗干净','酒精、次氯酸钙消毒，无菌水冲洗','无菌切取内部组织并放入培养皿'],
        knowledge:['韧皮部中的生活薄壁细胞分化程度较低，再生潜能强。','外植体先用流水冲洗；再用 75% 酒精消毒 30 s、10% 次氯酸钙消毒 10 min，最后用无菌水冲洗 3 次。','切取须使用已灭菌的镊子与解剖刀，不可用手直接接触材料。'],
        summary:'选择胡萝卜韧皮部，是因为其中生活薄壁细胞分裂潜能强，具备恢复全能性的基础。',
        quiz:'胡萝卜韧皮部适合作外植体的主要原因是？',
        options:['细胞已经完全木质化','生活细胞多且再生潜能强','含糖量越高越不易污染'],
        correct:1, explain:'正确。活的薄壁细胞分裂潜能较强，是组织培养常用的材料。'
      },
      {
        nav:'接种', eyebrow:'阶段 2 · MS 培养基与无菌接种', title:'认识 MS 培养基并完成无菌接种',
        desc:'先确认 MS 培养基的营养组成与激素作用，再在超净工作台内完成无菌接种。', day:1,
        task:'检查培养基并完成接种', copy:'先认识 MS 培养基组成，再灭菌接种工具，把外植体切口朝下接入培养基。',
        steps:['检查 MS 培养基组成与功能','火焰灭菌镊子并等待冷却','夹取外植体接入培养基'],
        knowledge:['培养基为离体组织提供水分、无机盐、糖、维生素和植物激素等营养。','培养基中还需加入适宜种类与配比的植物激素（生长素、细胞分裂素），它们是启动分裂、决定分化方向的关键。','外植体切口朝下与培养基充分接触，便于吸收养分、启动分裂。'],
        summary:'MS 培养基提供离体组织所需的矿质元素、碳源、维生素和激素；外植体在无菌条件下接入培养基后开始离体培养。',
        quiz:'', options:[], correct:0, explain:''
      },
      {
        nav:'脱分化', eyebrow:'阶段 3 · 脱分化', title:'诱导愈伤组织形成',
        desc:'启动培养时间快进，观察外植体细胞恢复分裂并形成愈伤组织。', day:12,
        task:'观察脱分化过程', copy:'推进培养时间，并在显微镜视野中确认细胞增殖。',
        steps:['启动时间快进至培养第 12 天','观察愈伤组织逐渐增殖','打开显微镜观察分裂细胞'],
        knowledge:['脱分化是已分化细胞在离体条件下恢复分裂能力的过程，通常需要生长素与细胞分裂素适中配比。','愈伤组织是形态不规则、未分化或低分化的细胞团。'],
        summary:'脱分化使成熟组织细胞重新进入细胞周期，形成可继续诱导分化的愈伤组织。',
        quiz:'愈伤组织的本质是？',
        options:['大量未分化或低分化细胞组成的细胞团','已经形成维管束的完整器官','营养液表面的微生物菌落'],
        correct:0, explain:'正确。愈伤组织是植物组织培养再生过程中的重要中间状态。'
      },
      {
        nav:'再分化', eyebrow:'阶段 4 · 再分化（重点）', title:'先诱导生芽，再诱导生根',
        desc:'愈伤组织表层细胞重新组织，先形成芽（茎叶系统），再产生不定根，成为完整试管苗。', day:28,
        task:'完成芽与根的分化', copy:'按顺序诱导芽和根，观察完整试管苗的建成过程。',
        steps:['诱导愈伤组织分化出芽点','观察芽点发育成带叶的幼芽','诱导幼芽基部产生不定根','确认芽与根齐全的完整试管苗'],
        knowledge:[
          '生芽：愈伤组织表层细胞重新组织，形成芽原基，再发育为带叶的幼芽，建立茎叶系统。',
          '生根：幼芽基部形成不定根，根系建立后，小植株才能独立吸收水分和无机盐。',
          '分化方向由培养基中生长素与细胞分裂素的比例决定：比例偏高利于生根，偏低利于生芽。',
          '分化顺序通常是先芽后根：先建立茎叶系统，再诱导生根，才能得到完整的试管苗。'
        ],
        summary:'再分化让无序增殖的愈伤组织重新建立器官秩序：先形成芽，再形成根，最终得到完整的试管苗。',
        quiz:'', options:[], correct:0, explain:''
      },
      {
        nav:'驯化移栽', eyebrow:'阶段 5 · 驯化与移栽', title:'让试管苗适应温室环境',
        desc:'逐步通风降低湿度，增强幼苗适应性，再移栽到消毒土壤。', day:42,
        task:'完成炼苗与移栽', copy:'先开盖炼苗，再逐步降低湿度，最后移栽。',
        steps:['打开瓶盖开始炼苗','逐步降低环境湿度至 70%','移栽至疏松、消毒的土壤'],
        knowledge:['试管苗角质层薄、气孔调节能力弱，直接移栽容易失水萎蔫。','逐步降湿能帮助叶片建立正常的蒸腾调节能力。'],
        summary:'驯化是连接无菌高湿环境与温室环境的桥梁；循序降湿比直接移栽更能提高成活率。',
        quiz:'试管苗移栽前为什么要炼苗？',
        options:['使植株逐步适应较低湿度与非无菌环境','让营养液颜色变深','让植株停止光合作用'],
        correct:0, explain:'正确。炼苗能降低环境突变造成的失水和死亡风险。'
      },
      {
        nav:'形成完整植株', eyebrow:'阶段 6 · 完整植株', title:'完成从细胞到个体的生命闭环',
        desc:'回顾外植体、愈伤组织、芽与根的发生，以及完整植株的形成。', day:90,
        task:'完成实验闭环', copy:'检查关键环节，确认植物细胞全能性的证据链。',
        steps:['回顾各关键培养节点','确认再生植株生长正常','生成实验报告摘要'],
        knowledge:['植物细胞全能性是离体细胞在适宜条件下发育成完整植株的潜能。','无菌环境、营养供给和芽根的有序分化共同决定培养成败。'],
        summary:'一小块胡萝卜韧皮部组织在适宜离体条件下可再生为完整植株，直观体现植物细胞全能性。',
        quiz:'本实验最直接体现了植物细胞的什么特性？',
        options:['专一性','全能性','不可逆性'],
        correct:1, explain:'正确。从离体组织再生为完整植株，是植物细胞全能性的经典证据。'
      }
    ];

    /* 无测验的阶段（完成后直接进入下一阶段） */
    const SKIP_QUIZ_STAGES = [2, 4];
    /* 有测验的阶段总数（用于报告显示） */
    const QUIZ_TOTAL = stages.filter((s,i)=>!SKIP_QUIZ_STAGES.includes(i)).length;
    /* 每个阶段“第几步对应哪个操作”，供右侧步骤点击与自动演示共用 */
    const STAGE_ACTS = [
      ['uvOn','uvOff'],
      ['tissue','rinse','sterilize','cut'],
      ['inspectMS','sterileTool','inoculate'],
      ['time','growCallus','scope'],
      ['bud','observeBud','root','check'],
      ['openCap','dry','transplant'],
      ['review','checkPlant','report']
    ];

    let current = 0, step = 0, errors = 0, quizScore = 0, autoMode = false, autoTimer = null, autoStall = 0;
    let transitionPending = false;
    let busyUntil = 0;
    let toolSterile = false, msChecked = false, tissueChosen = false, tissueRinsed = false, tissueSterile = false, capOpened = false;
    let humidity = 95, drying = false;
    const completed = new Set(), answered = new Set();

    const $ = s => document.querySelector(s);
    const nav = $('#stageNav'), scene = $('#scene'), actions = $('#sceneActions');

    /* ============ 顶部导航 / 步骤 / 反馈 ============ */
    function navHTML(){
      nav.innerHTML = stages.map((s,i)=>`<button class="stage-tab ${i===current?'active':''} ${completed.has(i)?'done':''}" data-stage="${i}" aria-current="${i===current?'step':'false'}"><span class="stage-num">${completed.has(i)?'✓':i}</span><span>${s.nav}</span></button>`).join('');
    }
    function stepHTML(){
      const acts = STAGE_ACTS[current] || [];
      $('#steps').innerHTML = stages[current].steps.map((s,i)=>{
        const a = acts[i] || '';
        return `<button type="button" class="step ${i<step?'done':i===step?'current':''}${a?'':' noact'}" data-step="${i}" data-act="${a}"><i>${i<step?'✓':i+1}</i><span>${s}</span></button>`;
      }).join('');
    }
    function feedback(type,title,text){
      const box=$('#feedback'); box.className='panel-card feedback '+type;
      $('#feedbackIcon').textContent = type==='success'?'✓':type==='error'?'!':'◎';
      $('#feedbackTitle').textContent = title; $('#feedbackText').textContent = text;
    }
    function toast(msg,type=''){
      const t=$('#toast'); t.textContent=msg; t.className='toast show '+type;
      clearTimeout(t._to); t._to=setTimeout(()=>t.className='toast',2400);
    }
    function beep(ok=true){
      try{
        const ac=new (window.AudioContext||window.webkitAudioContext)();
        const o=ac.createOscillator(), g=ac.createGain();
        o.frequency.value = ok?660:220;
        g.gain.setValueAtTime(.04,ac.currentTime);
        g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.16);
        o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime+.16);
      }catch(e){}
    }
    function wrong(msg,help){ errors++; beep(false); feedback('error',msg,help); toast(msg,'bad'); }
    function good(msg,detail){
      beep(true); feedback('success',msg,detail); toast(msg,'good'); step++; stepHTML(); renderActions();
      if(step>=stages[current].steps.length){
        completed.add(current); updateProgress(); transitionPending = true;
        const st = current;
        if(SKIP_QUIZ_STAGES.includes(st)){
          /* 无测验阶段：等动作演示完整后再进入下一阶段 */
          setTimeout(()=>{
            if(current!==st) return;
            if(st<stages.length-1) changeStage(st+1);
            else openReport();
          }, 3200);
        }else{
          setTimeout(()=>openQuiz(st),1900);
        }
      }
    }
    function updateProgress(){
      const pct = Math.round(completed.size/stages.length*100);
      $('#progressFill').style.width = pct+'%';
      $('#progressPercent').textContent = pct+'%';
      $('#progressLabel').textContent = completed.size===0 ? '等待开始'
        : completed.size===stages.length ? '实验完成'
        : `已完成 ${completed.size} / ${stages.length} 个阶段`;
      navHTML();
    }

    /* ============ 图形素材 ============ */
    const cellPositions = [[58,34],[42,46],[75,48],[55,57],[87,29],[29,31],[96,54],[18,49],[71,18],[104,17],[39,19],[83,68],[12,22],[113,42],[27,65],[99,72],[52,75],[119,61],[66,3],[5,58],[91,5],[126,28],[12,75],[111,2],[33,2],[130,52],[70,72],[48,3]];
    function callusCells(count){
      return cellPositions.slice(0,count).map((p,i)=>`<i class="callus-cell ${i<3?'dividing':''}" style="--x:${p[0]}px;--y:${p[1]}px;animation-delay:${i*.06}s"></i>`).join('');
    }
    function plantletMarkup(){
      return `<i class="plant-stem"></i>
        <span class="plant-node" style="--b:70px"><i class="plant-leaf left"></i><i class="plant-leaf right"></i></span>
        <span class="plant-node" style="--b:104px"><i class="plant-leaf left"></i><i class="plant-leaf right"></i></span>
        <span class="plant-node top" style="--b:136px"><i class="plant-leaf left"></i><i class="plant-leaf right"></i></span>
        <i class="plant-tip"></i>
        <span class="root-bundle"><i class="root-strand"></i><i class="root-strand"></i><i class="root-strand"></i><i class="root-strand"></i><i class="root-strand"></i></span>`;
    }
    function budMarkup(){
      const pos=[[10,16],[38,6],[66,18],[94,4],[120,14]];
      return pos.map(p=>`<i class="bud" style="left:${p[0]}px;top:${p[1]}px"></i>`).join('');
    }

    /* ============ 渲染 ============ */
    function render(){
      const s = stages[current];
      step = completed.has(current) ? s.steps.length : 0;
      $('#stageEyebrow').textContent = s.eyebrow;
      $('#stageTitle').textContent = s.title;
      $('#stageDesc').textContent = s.desc;
      $('#dayChip').textContent = `培养第 ${s.day} 天`;
      $('#taskTitle').textContent = s.task;
      $('#taskCopy').textContent = s.copy;
      $('#prevBtn').disabled = current===0;
      $('#nextBtn').textContent = current===6 ? '查看报告' : '下一阶段';
      $('#labStatus').textContent =
        current===0 ? '无菌环境准备中' :
        current<5 ? '培养条件稳定' : '温室环境稳定';
      $('#principleTitle').textContent = current===0 ? '安全与无菌原则' : current===2 ? 'MS 培养基要点' : current===4 ? '器官发生关键' : '本阶段关键知识';
      $('#principleList').innerHTML = s.knowledge.slice(0,3).map(k=>`<li>${k}</li>`).join('');
      renderScene(); stepHTML(); navHTML();
      feedback('', completed.has(current)?'本阶段已完成':'等待操作',
        completed.has(current)?'可切换阶段复习，或继续下一阶段。':'请根据任务顺序完成操作。');
    }

    /* ============ 场景素材 ============ */
    function hud(t,h){ return `<div class="env-hud"><span class="env-chip temp">温度<b>${t}℃</b></span><span class="env-chip hum">湿度<b>${h}%</b></span></div>`; }
    function carrotHTML(){ return `<div class="carrot"><i class="leaf l1"></i><i class="leaf l2"></i><i class="leaf l3"></i><i class="leaf l4"></i><div class="carrot-root"><div class="carrot-core"></div></div></div>`; }
    function handHTML(tool,handCls){ return `<div class="hand ${handCls||''}"><i class="sleeve"></i><i class="cuff"></i><i class="mid"></i><i class="palm"></i><i class="thumb"></i><i class="finger"></i>${tool||''}</div>`; }
    function rigHTML(id,cls,tool,handCls){ return `<div class="rig ${cls}" id="${id}">${handHTML(tool,handCls)}</div>`; }

    function fastTime(to, cb){
      const ff=$('#fastForward'), num=$('#timeNumber');
      ff.classList.add('on');
      let n=0;
      const int=setInterval(()=>{
        n++; num.textContent=`第 ${n} 天`;
        if(n>=to){ clearInterval(int); setTimeout(()=>{ ff.classList.remove('on'); cb&&cb(); },350); }
      }, Math.max(45, 650/to));

    function growCellCluster(){
      const cluster=$('#callusCluster'); if(!cluster) return;
      let count=cluster.children.length;
      const timer=setInterval(()=>{
        if(!document.body.contains(cluster)||count>=26){ clearInterval(timer); return; }
        const p=cellPositions[count];
        const cell=document.createElement('i');
        cell.className='callus-cell'+(count%5===0?' dividing':'');
        cell.style.setProperty('--x',p[0]+'px');
        cell.style.setProperty('--y',p[1]+'px');
        cluster.appendChild(cell); count++;
        if(count>=26){ clearInterval(timer); setTimeout(()=>good('细胞团块持续增殖','细胞体积基本不变，但分裂产生的新细胞不断增加并聚集。'),350); }
      },105);
    }
    function drawCells(active){
      const c=$('#cellCanvas'); if(!c) return;
      const x=c.getContext('2d'); let frame=0;
      const cap=$('#cellCaption');
      if(cap) cap.innerHTML = active
        ? '脱分化：细胞变圆、<b>恢复分裂能力</b>，聚集成愈伤组织'
        : '取材时：韧皮部细胞<b>细长、排列有序</b> —— 已高度分化';
      function roundRect(gx,gy,w,h,r){
        x.beginPath();
        x.moveTo(gx+r,gy); x.lineTo(gx+w-r,gy); x.quadraticCurveTo(gx+w,gy,gx+w,gy+r);
        x.lineTo(gx+w,gy+h-r); x.quadraticCurveTo(gx+w,gy+h,gx+w-r,gy+h);
        x.lineTo(gx+r,gy+h); x.quadraticCurveTo(gx,gy+h,gx,gy+h-r);
        x.lineTo(gx,gy+r); x.quadraticCurveTo(gx,gy,gx+r,gy);
        x.closePath();
      }
      function draw(){
        x.clearRect(0,0,c.width,c.height);
        x.fillStyle='#edf7f7'; x.fillRect(0,0,c.width,c.height);
        if(!active){
          /* 已分化的韧皮部细胞：细长、成行排列 */
          const cw=44, ch=118, gx0=(500-(7*cw+6*16))/2, gy0=(360-(2*ch+26))/2;
          for(let i=0;i<14;i++){
            const col=i%7, row=Math.floor(i/7);
            const gx=gx0+col*(cw+16), gy=gy0+row*(ch+26);
            roundRect(gx,gy,cw,ch,12);
            x.fillStyle=`hsla(${52+col*3},58%,${72-col*2}%,.85)`; x.fill();
            x.strokeStyle='rgba(120,90,40,.42)'; x.lineWidth=2; x.stroke();
            x.beginPath(); x.ellipse(gx+cw/2,gy+ch/2,7,17,0,0,Math.PI*2);
            x.fillStyle='rgba(150,105,45,.32)'; x.fill();
          }
          return;
        }
        for(let i=0;i<28;i++){
          const a=i*2.399+frame*.002;
          const r=35+(i%5)*20;
          const cx=250+Math.cos(a)*r, cy=180+Math.sin(a)*r*.66, rad=12+(i%4)*2;
          x.beginPath(); x.arc(cx,cy,rad,0,Math.PI*2);
          x.fillStyle=`hsla(${55+i*2},55%,${70-i%3*5}%,.8)`; x.fill();
          x.strokeStyle='rgba(70,120,80,.45)'; x.stroke();
          x.beginPath(); x.arc(cx+3,cy-2,4,0,Math.PI*2);
          x.fillStyle='rgba(73,120,83,.45)'; x.fill();
        }
        if(frame++<240) requestAnimationFrame(draw);
      }
      draw();
    }
