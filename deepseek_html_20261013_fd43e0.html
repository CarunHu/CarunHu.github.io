<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="胡萝卜组织培养：从外植体到完整植株的交互式虚拟仿真实验">
  <title>胡萝卜组织培养 · 虚拟仿真实验</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%233E9B5A' d='M32 23C18 21 12 10 12 3c12 0 20 6 22 17C37 8 45 3 55 5c-2 11-10 18-22 19z'/%3E%3Cpath fill='%23F5A623' d='M20 22c0 22 8 36 12 39 5-4 13-18 12-39z'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #eef2f5;
      --panel: rgba(255,255,255,.78);
      --line: #d0d6dd;
      --ink: #1f2a35;
      --muted: #687481;
      --green: #3e9b5a;
      --leaf: #7ec850;
      --orange: #f5a623;
      --yellow: #f0c040;
      --blue: #4d8ca8;
      --danger: #d95f55;
      --shadow: 0 18px 48px rgba(58,72,86,.14);
      --glass: linear-gradient(145deg,rgba(255,255,255,.82),rgba(214,232,238,.38));
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    body { overflow-x: hidden; }

    .app {
      min-height: 100vh;
      background:
        radial-gradient(circle at 82% 12%, rgba(240,192,64,.16), transparent 22rem),
        linear-gradient(135deg,#f8fafc 0%,#e9eef2 50%,#f3f6f7 100%);
    }

    .topbar {
      min-height: 72px; display: flex; align-items: center; gap: 22px; padding: 12px 26px;
      background: rgba(248,250,252,.88); border-bottom: 1px solid rgba(148,160,171,.26);
      backdrop-filter: blur(18px); position: sticky; top: 0; z-index: 30;
      box-shadow: 0 8px 28px rgba(71,84,96,.08);
    }

    .brand { display: flex; align-items: center; gap: 12px; min-width: 275px; }
    .brand-mark { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; background: linear-gradient(145deg,var(--green),#237441); color: white; font-size: 22px; box-shadow: 0 8px 18px rgba(62,155,90,.25); }
    .brand h1 { font-size: 17px; margin: 0; letter-spacing: .02em; }
    .brand p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }

    .progress-area { flex: 1; min-width: 180px; }
    .progress-copy { display: flex; justify-content: space-between; align-items: end; margin-bottom: 7px; font-size: 12px; color: var(--muted); }
    .progress-copy strong { color: var(--green); font-size: 16px; }
    .progress-track { height: 8px; border-radius: 99px; background: #dce2e7; overflow: hidden; box-shadow: inset 0 1px 3px rgba(50,60,70,.12); }
    .progress-fill { height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg,var(--green),var(--leaf),var(--orange)); transition: width .65s cubic-bezier(.2,.7,.2,1); position: relative; }
    .progress-fill::after { content:""; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent); animation: sheen 2s infinite; }

    .status-pill { display:flex; align-items:center; gap:8px; padding:9px 12px; background:white; border:1px solid var(--line); border-radius:99px; font-size:12px; white-space:nowrap; }
    .status-dot { width:8px; height:8px; border-radius:50%; background:var(--green); box-shadow:0 0 0 5px rgba(62,155,90,.12); }

    .stage-nav {
      display: grid; grid-template-columns: repeat(7, minmax(108px, 1fr)); gap: 8px;
      padding: 14px 24px 8px; max-width: 1500px; margin: auto;
    }
    .stage-tab { border:1px solid transparent; background:rgba(255,255,255,.52); border-radius:14px; padding:10px 10px; display:flex; align-items:center; gap:9px; color:#596573; text-align:left; transition:.25s ease; min-width:0; }
    .stage-tab:hover { background:white; transform:translateY(-2px); box-shadow:0 8px 20px rgba(60,75,90,.08); }
    .stage-tab.active { background:#fff; border-color:rgba(62,155,90,.35); color:var(--ink); box-shadow:0 8px 22px rgba(62,155,90,.10); }
    .stage-tab.done .stage-num { background:var(--green); color:white; }
    .stage-num { flex:0 0 29px; width:29px; height:29px; border-radius:9px; display:grid; place-items:center; background:#e1e6ea; font-weight:800; font-size:12px; }
    .stage-tab.active .stage-num { background:var(--orange); color:white; }
    .stage-tab span:last-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; font-weight:700; }

    .workspace { max-width:1500px; margin:0 auto; padding:8px 24px 24px; display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:18px; }
    .lab-shell { min-height:660px; border-radius:24px; position:relative; overflow:hidden; background:linear-gradient(#dae1e6 0 7%,#f7f9fa 7% 72%,#d1d7dc 72% 76%,#aeb7bf 76% 100%); border:1px solid rgba(255,255,255,.9); box-shadow:var(--shadow),inset 0 1px 0 white; }
    .lab-shell::before { content:""; position:absolute; left:8%; right:8%; top:7%; height:42px; background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(220,242,249,.65)); box-shadow:0 8px 34px rgba(174,222,235,.72); border-radius:0 0 22px 22px; }
    .lab-shell::after { content:""; position:absolute; left:0; right:0; top:72%; height:4px; background:rgba(255,255,255,.85); box-shadow:0 -3px 12px rgba(255,255,255,.8); }
    .lab-head { position:absolute; top:66px; left:24px; right:24px; display:flex; justify-content:space-between; align-items:flex-start; z-index:3; }
    .eyebrow { display:inline-flex; align-items:center; gap:8px; padding:6px 10px; border-radius:99px; background:rgba(255,255,255,.72); color:var(--green); font-size:12px; font-weight:800; letter-spacing:.08em; border:1px solid rgba(255,255,255,.8); }
    .lab-head h2 { font-size:28px; margin:9px 0 4px; letter-spacing:-.03em; }
    .lab-head p { margin:0; color:var(--muted); max-width:650px; line-height:1.65; font-size:14px; }
    .day-chip { padding:10px 13px; color:white; background:rgba(35,52,63,.82); border-radius:12px; font-size:12px; font-weight:700; backdrop-filter:blur(8px); }

    .scene { position:absolute; inset:160px 30px 140px; display:grid; place-items:center; z-index:2; }
    .scene-card { width:min(820px,100%); min-height:360px; position:relative; display:flex; align-items:center; justify-content:center; gap:48px; padding:24px; }

    .glass { background:var(--glass); border:1px solid rgba(255,255,255,.8); box-shadow:inset 5px 0 10px rgba(255,255,255,.55),inset -6px 0 12px rgba(87,120,132,.08),0 20px 30px rgba(76,91,102,.13); backdrop-filter:blur(6px); position:relative; }
    .petri { width:180px; height:62px; border-radius:50%; }
    .petri::before { content:""; position:absolute; inset:-12px 3px 17px; border-radius:50%; background:rgba(255,255,255,.34); border:2px solid rgba(255,255,255,.78); box-shadow:inset 0 -8px 12px rgba(125,180,153,.10); }
    .testtube { width:86px; height:230px; border-radius:14px 14px 38px 38px; border-top:7px solid rgba(255,255,255,.85); overflow:hidden; }
    .medium { position:absolute; left:4px; right:4px; bottom:3px; height:28%; border-radius:10px 10px 35px 35px; background:linear-gradient(rgba(240,192,64,.3),rgba(245,166,35,.48)); box-shadow:0 -6px 18px rgba(240,192,64,.15); }

    .scene-label { position:absolute; left:50%; bottom:-52px; transform:translateX(-50%); width:max-content; max-width:240px; text-align:center; font-size:13px; color:#52606b; background:rgba(255,255,255,.72); border:1px solid white; border-radius:10px; padding:8px 12px; box-shadow:0 7px 15px rgba(60,70,80,.08); }
    .pulse { animation:pulse 1.7s infinite; }
    .action-object { transition:transform .3s ease,filter .3s ease; }
    .action-object:hover { transform:translateY(-5px) scale(1.025); filter:saturate(1.08); }

    .tool-tray { width:220px; height:115px; border-radius:24px; display:flex; align-items:center; justify-content:center; gap:24px; }
    .scalpel { width:142px; height:12px; border-radius:10px; background:linear-gradient(90deg,#c5ccd2 0 62%,#72808b 62%); transform:rotate(-12deg); box-shadow:0 5px 10px rgba(40,50,60,.18); position:relative; }
    .scalpel::after { content:""; position:absolute; right:-28px; top:1px; border-left:30px solid #b5c0c8; border-top:5px solid transparent; border-bottom:5px solid transparent; }

    .airflow { width:320px; height:190px; border-radius:20px; background:linear-gradient(145deg,rgba(255,255,255,.65),rgba(194,220,228,.28)); border:1px solid white; position:relative; overflow:hidden; box-shadow:inset 0 0 28px rgba(122,190,210,.15); }
    .air-line { position:absolute; left:-40%; width:70%; height:2px; background:linear-gradient(90deg,transparent,rgba(77,140,168,.7),transparent); animation:air 2.2s linear infinite; }
    .air-line:nth-child(1){top:25%;animation-delay:0s}.air-line:nth-child(2){top:48%;animation-delay:.45s}.air-line:nth-child(3){top:71%;animation-delay:.9s}
    .uv-lamp { position:absolute; top:14px; left:32px; right:32px; height:18px; border-radius:9px; background:#b8dfe8; box-shadow:0 0 30px rgba(102,201,225,.85); }
    .bench-badge { position:absolute; bottom:18px; left:50%; transform:translateX(-50%); font-weight:800; color:#55636e; }

    .carrot { width:115px; height:240px; position:relative; filter:drop-shadow(0 18px 15px rgba(164,101,26,.18)); }
    .carrot-root { position:absolute; top:50px; left:27px; width:70px; height:176px; background:linear-gradient(90deg,#f18d16,#ffb43b 46%,#df7d0e); border-radius:42% 42% 58% 58% / 15% 15% 85% 85%; clip-path:polygon(8% 0,92% 0,75% 68%,51% 100%,28% 69%); }
    .carrot-core { position:absolute; top:54px; left:51px; width:28px; height:134px; background:rgba(255,220,130,.58); border-radius:50%; }
    .leaf { position:absolute; width:16px; height:70px; border-radius:90% 0 90% 0; background:linear-gradient(#7ec850,#318b4d); transform-origin:bottom center; bottom:182px; left:49px; }
    .leaf.l1{transform:rotate(-40deg)}.leaf.l2{transform:rotate(-19deg);height:83px}.leaf.l3{transform:rotate(4deg);height:88px}.leaf.l4{transform:rotate(29deg);height:78px}
    .slice-ring { width:150px; height:150px; border-radius:50%; background:radial-gradient(circle,#ffe3a1 0 26%,#f59e20 27% 68%,#df7b0f 69%); box-shadow:0 18px 28px rgba(153,91,20,.16),inset 0 0 0 7px rgba(255,255,255,.2); position:relative; }
    .slice-ring::after { content:"韧皮部"; position:absolute; right:-28px; top:17px; color:white; font-weight:800; background:var(--green); padding:6px 10px; border-radius:8px; transform:rotate(6deg); }

    .callus-cluster { width:150px; height:92px; position:relative; margin:0 auto; filter:drop-shadow(0 10px 12px rgba(91,110,55,.15)); }
    .callus-cell { position:absolute; width:26px; height:24px; left:var(--x); top:var(--y); border-radius:46% 54% 51% 49%; background:radial-gradient(circle at 35% 28%,#fff8d8 0 18%,#dfe3a4 60%,#aabb69 100%); border:1px solid rgba(129,148,76,.28); box-shadow:inset -4px -4px 7px rgba(95,116,51,.12),inset 3px 3px 5px rgba(255,255,255,.55); animation:cellBorn .5s cubic-bezier(.2,.8,.3,1) both; }
    .callus-cell.dividing::after { content:""; position:absolute; inset:2px 10px; border-radius:50%; background:rgba(85,122,57,.28); animation:divisionFurrow .8s ease-in-out infinite alternate; }
    .cell-canvas { width:250px; height:180px; border-radius:50%; background:#edf7f7; border:10px solid #c6d0d5; box-shadow:inset 0 0 25px rgba(60,90,100,.2),0 15px 24px rgba(50,70,80,.14); }
    .microscope { display:flex; flex-direction:column; align-items:center; gap:10px; }
    .microscope small { color:var(--muted); }

    .buds { position:absolute; left:50%; top:50%; width:150px; height:70px; transform:translate(-50%,-50%); pointer-events:none; }
    .bud { position:absolute; width:14px; height:18px; border-radius:60% 60% 45% 45%/72% 72% 28% 28%; background:linear-gradient(160deg,#9ade63,#3e9b5a); box-shadow:0 4px 8px rgba(60,110,60,.2); opacity:0; transform:scale(.2) translateY(8px); transition:opacity .55s ease,transform .8s cubic-bezier(.2,.8,.3,1); }
    .bud.show { opacity:1; transform:scale(1) translateY(0); }

    .plantlet { position:absolute; left:50%; bottom:20px; width:116px; height:174px; transform:translateX(-50%) scaleY(.08); transform-origin:50% 100%; opacity:.25; transition:transform 2.1s cubic-bezier(.18,.76,.25,1),opacity .65s ease; }
    .plantlet.grow { transform:translateX(-50%) scaleY(1); opacity:1; }
    .plantlet.sprout { bottom:-12px; transform:translateX(-50%) scale(.68,.05); }
    .plantlet.sprout.grow { transform:translateX(-50%) scale(.68); }
    .plant-stem { position:absolute; left:55px; bottom:45px; width:7px; height:112px; border-radius:6px; background:linear-gradient(90deg,#318b4d,#70c456 55%,#348f4d); box-shadow:inset 2px 0 rgba(255,255,255,.28); }
    .plant-node { position:absolute; left:58px; bottom:var(--b); width:1px; height:1px; }
    .plant-leaf { position:absolute; bottom:-1px; width:43px; height:24px; background:linear-gradient(135deg,#8bd354,#3e9b5a); box-shadow:inset 6px 5px 10px rgba(255,255,255,.16); }
    .plant-leaf.left { right:0; border-radius:100% 0 100% 0; transform:rotate(17deg); transform-origin:100% 100%; }
    .plant-leaf.right { left:0; border-radius:0 100% 0 100%; transform:rotate(-17deg); transform-origin:0 100%; }
    .plant-node.top .plant-leaf { width:35px; height:20px; }
    .plant-tip { position:absolute; left:48px; bottom:151px; width:22px; height:30px; background:linear-gradient(135deg,#96db5f,#3e9b5a); border-radius:100% 0 100% 0; transform:rotate(43deg); }
    .root-bundle { position:absolute; left:58px; bottom:2px; width:1px; height:46px; opacity:0; transition:opacity .9s ease .15s; }
    .plantlet.rooted .root-bundle { opacity:1; }
    .root-strand { position:absolute; top:0; left:0; width:2px; height:43px; background:#d7ac6c; transform-origin:top; border-radius:2px; }
    .root-strand:nth-child(2){transform:rotate(22deg);height:39px}.root-strand:nth-child(3){transform:rotate(-24deg);height:42px}.root-strand:nth-child(4){transform:rotate(40deg);height:31px}.root-strand:nth-child(5){transform:rotate(-41deg);height:32px}

    .humidity-dome { width:220px; height:210px; border-radius:105px 105px 18px 18px; background:linear-gradient(145deg,rgba(255,255,255,.68),rgba(185,222,230,.24)); border:1px solid rgba(255,255,255,.9); box-shadow:inset 8px 0 15px rgba(255,255,255,.5),0 16px 26px rgba(60,80,90,.12); backdrop-filter:blur(6px); position:relative; transition:box-shadow .5s ease; }
    .humidity-dome.open { box-shadow:inset 8px 0 15px rgba(255,255,255,.5),0 16px 26px rgba(60,80,90,.12),0 0 0 8px rgba(126,200,80,.18); }
    .soil-pot { position:absolute; bottom:10px; left:58px; width:105px; height:72px; background:linear-gradient(90deg,#9f592f,#c16d37); clip-path:polygon(0 0,100% 0,86% 100%,14% 100%); }
    .soil { position:absolute; left:4px; right:4px; top:-5px; height:16px; background:#5c4932; border-radius:50%; }
    .humidity-readout { position:absolute; top:16px; left:50%; transform:translateX(-50%); font-size:12px; font-weight:800; color:#386b7a; background:rgba(255,255,255,.78); border:1px solid rgba(255,255,255,.95); padding:5px 11px; border-radius:99px; white-space:nowrap; }

    .full-plant { width:230px; height:320px; position:relative; animation:float 4s ease-in-out infinite; }
    .full-plant .carrot-root { top:148px; left:76px; width:84px; height:166px; }
    .full-plant .leaf { bottom:162px; left:108px; height:145px; width:20px; }
    .full-plant .leaf.l2,.full-plant .leaf.l4{height:165px}.full-plant .leaf.l3{height:180px}
    .orbit { position:absolute; width:420px; height:300px; border:1px dashed rgba(62,155,90,.4); border-radius:50%; animation:spin 16s linear infinite; }
    .orbit .dot { position:absolute; width:52px; height:52px; border-radius:50%; background:white; border:1px solid var(--line); display:grid; place-items:center; box-shadow:0 8px 16px rgba(50,70,80,.10); font-size:23px; }
    .orbit .dot:nth-child(1){left:-24px;top:124px}.orbit .dot:nth-child(2){right:-24px;top:124px}.orbit .dot:nth-child(3){left:184px;top:-25px}.orbit .dot:nth-child(4){left:184px;bottom:-25px}

    .scene-actions { position:absolute; left:24px; right:24px; bottom:24px; display:flex; gap:10px; align-items:center; min-height:86px; padding:15px; border-radius:18px; background:rgba(248,250,251,.76); border:1px solid rgba(255,255,255,.85); backdrop-filter:blur(10px); z-index:5; }
    .action-hint { margin-right:auto; min-width:170px; }
    .action-hint b { display:block; font-size:14px; margin-bottom:4px; }.action-hint span{font-size:12px;color:var(--muted)}
    .btn { border:0; border-radius:12px; padding:11px 15px; background:#fff; color:var(--ink); box-shadow:0 5px 12px rgba(70,80,90,.10); font-weight:700; font-size:13px; transition:.2s ease; }
    .btn:hover { transform:translateY(-2px); box-shadow:0 8px 18px rgba(70,80,90,.14); }
    .btn:active { transform:translateY(0); }
    .btn.primary { background:linear-gradient(135deg,var(--green),#2e8248); color:white; }
    .btn.orange { background:linear-gradient(135deg,var(--orange),#e58d0a); color:white; }
    .btn.ghost { background:transparent; border:1px solid var(--line); box-shadow:none; }
    .btn:disabled { opacity:.42; cursor:not-allowed; transform:none; }

    .side-panel { display:flex; flex-direction:column; gap:14px; }
    .panel-card { background:var(--panel); border:1px solid rgba(255,255,255,.85); border-radius:20px; padding:18px; backdrop-filter:blur(12px); box-shadow:0 12px 30px rgba(67,80,90,.09); }
    .panel-kicker { color:var(--green); font-size:11px; font-weight:900; letter-spacing:.12em; margin-bottom:8px; }
    .panel-card h3 { margin:0 0 9px; font-size:17px; }.panel-card p{margin:0;color:var(--muted);line-height:1.7;font-size:13px}
    .steps { margin-top:13px; display:grid; gap:9px; }
    .step { display:grid; grid-template-columns:24px 1fr; gap:9px; align-items:start; padding:9px; border-radius:12px; background:rgba(237,241,244,.66); font-size:12px; color:#5f6b77; width:100%; text-align:left; border:0; font-family:inherit; cursor:pointer; transition:background .18s, box-shadow .18s, transform .1s; }
    .step:hover { background:rgba(74,134,173,.16); }
    .step:active { transform:translateY(1px); }
    .step.noact { cursor:default; }
    .step.noact:hover { background:rgba(237,241,244,.66); }
    .step i { width:24px;height:24px;border-radius:8px;background:white;display:grid;place-items:center;font-style:normal;font-weight:800;color:#77838e; }
    .step.done { background:rgba(62,155,90,.11); color:#286d3d; }.step.done i{background:var(--green);color:white}
    .step.current { outline:2px solid rgba(245,166,35,.35); background:rgba(245,166,35,.09); color:#82530e; }

    .feedback { min-height:74px; position:relative; overflow:hidden; }
    .feedback-line { display:flex; gap:10px; align-items:flex-start; }
    .feedback-icon { width:32px;height:32px;flex:0 0 32px;border-radius:10px;display:grid;place-items:center;background:#e9eef1; }
    .feedback.success .feedback-icon { background:rgba(62,155,90,.15);color:var(--green)}
    .feedback.error .feedback-icon { background:rgba(217,95,85,.13);color:var(--danger)}
    .feedback strong{font-size:13px;display:block;margin-bottom:3px}.feedback span{font-size:12px;color:var(--muted);line-height:1.5}

    .knowledge { border-left:4px solid var(--orange); }
    .knowledge ul { margin:10px 0 0; padding-left:19px; color:#596570; font-size:13px; line-height:1.7; }

    .bottom-controls { display:flex; gap:10px; margin-top:auto; }
    .bottom-controls .btn { flex:1; }
    .auto.active { background:var(--orange); color:white; }

    .toast { position:fixed; left:50%; bottom:26px; transform:translate(-50%,100px); opacity:0; z-index:100; background:#26343d; color:#fff; padding:12px 17px; border-radius:12px; box-shadow:0 16px 35px rgba(20,30,35,.25); font-size:13px; transition:.35s cubic-bezier(.2,.8,.2,1); pointer-events:none; }
    .toast.show { transform:translate(-50%,0); opacity:1; }
    .toast.good { background:#256d3c; }.toast.bad{background:#a9433b}

    .modal-backdrop { position:fixed; inset:0; background:rgba(32,43,51,.42); backdrop-filter:blur(8px); z-index:80; display:none; place-items:center; padding:20px; }
    .modal-backdrop.open { display:grid; animation:fadeIn .25s ease; }
    .modal { width:min(560px,100%); max-height:90vh; overflow:auto; background:rgba(255,255,255,.96); border:1px solid white; border-radius:24px; padding:24px; box-shadow:0 30px 80px rgba(30,45,55,.28); }
    .modal .badge { display:inline-block;background:rgba(62,155,90,.12);color:var(--green);padding:6px 9px;border-radius:8px;font-size:11px;font-weight:900; }
    .modal h3 { margin:12px 0 8px;font-size:22px}.modal p{color:var(--muted);font-size:14px;line-height:1.7}
    .quiz-options { display:grid;gap:8px;margin:14px 0; }.quiz-option{border:1px solid var(--line);background:#f8fafb;border-radius:12px;padding:11px 13px;text-align:left;color:#44515d}.quiz-option:hover{border-color:var(--green);background:#f0f8f2}.quiz-option.correct{background:rgba(62,155,90,.12);border-color:var(--green)}.quiz-option.wrong{background:rgba(217,95,85,.10);border-color:var(--danger)}
    .modal-actions { display:flex;justify-content:flex-end;gap:10px;margin-top:16px; }

    .report { width:min(740px,100%); }
    .report-grid { display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0; }.report-stat{background:#f0f4f3;border-radius:14px;padding:14px;text-align:center}.report-stat b{display:block;font-size:24px;color:var(--green)}.report-stat span{font-size:11px;color:var(--muted)}
    .report-table { width:100%;border-collapse:collapse;font-size:12px; }.report-table td{padding:9px;border-bottom:1px solid #e2e6e9}.report-table td:last-child{text-align:right;color:var(--green);font-weight:700}

    .fast-forward { position:absolute; inset:0; z-index:12; display:none; place-items:center; background:rgba(235,242,244,.62); backdrop-filter:blur(5px); }
    .fast-forward.on { display:grid; }
    .time-wheel { text-align:center; }.time-wheel b{display:block;font-size:48px;color:var(--green);font-variant-numeric:tabular-nums}.time-wheel span{color:#50606b;font-weight:800}.time-bars{display:flex;gap:6px;justify-content:center;margin-top:13px}.time-bars i{width:38px;height:5px;background:var(--orange);border-radius:5px;animation:timeBar .6s infinite alternate}.time-bars i:nth-child(2){animation-delay:.15s}.time-bars i:nth-child(3){animation-delay:.3s}

    .sr-only { position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0; }

    @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(245,166,35,.10),0 12px 25px rgba(80,90,100,.12)}50%{box-shadow:0 0 0 13px rgba(245,166,35,.16),0 12px 25px rgba(80,90,100,.16)} }
    @keyframes sheen { from{transform:translateX(-100%)}to{transform:translateX(100%)} }
    @keyframes air { from{transform:translateX(0)}to{transform:translateX(230%)} }
    @keyframes cellBorn { from{opacity:0;transform:scale(.35)}to{opacity:1;transform:scale(1)} }
    @keyframes divisionFurrow { from{transform:scaleX(.25)}to{transform:scaleX(1)} }
    @keyframes float { 0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)} }
    @keyframes spin { to{transform:rotate(360deg)} }
